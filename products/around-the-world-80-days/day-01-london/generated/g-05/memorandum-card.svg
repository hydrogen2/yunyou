<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Memorandum of the wager — Reform Club, Pall Mall — Wednesday 2 October 1872">
<title>Memorandum of the wager — Reform Club, Pall Mall — Wednesday 2 October 1872</title>
<style>text{font-kerning:normal} .row rect.hit{fill:#2a2118;fill-opacity:0;cursor:pointer} .row:hover rect.hit,.row:focus rect.hit{fill-opacity:.07} .row:focus{outline:none}</style>
<rect width="1920" height="1080" fill="#efe6d3"/>
<rect x="48" y="48" width="1824" height="984" fill="none" stroke="#2a2118" stroke-width="3"/><rect x="56" y="56" width="1808" height="968" fill="none" stroke="#2a2118" stroke-width="1"/><text x="960" y="130" font-family="'Source Sans 3', system-ui, sans-serif" font-size="26" fill="#5b4a3a" font-weight="600" text-anchor="middle" letter-spacing="10">MEMORANDUM</text><text x="960" y="215" font-family="'Playfair Display', Georgia, serif" font-size="84" fill="#2a2118" font-weight="700" text-anchor="middle">The Wager</text><text x="960" y="268" font-family="'Source Sans 3', system-ui, sans-serif" font-size="32" fill="#5b4a3a" text-anchor="middle">Reform Club, Pall Mall — Wednesday 2 October 1872</text><line x1="400" y1="300" x2="1520" y2="300" stroke="#b03a2e" stroke-width="4"/><text x="128" y="380" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#2a2118">That Mr Phileas Fogg shall go round the world</text><text x="128" y="434" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#2a2118">in “eighty days or less”;</text><text x="128" y="488" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#2a2118">that he stakes “twenty thousand at Baring’s” —</text><text x="128" y="542" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#2a2118">“half of his fortune” — against the five undersigned;</text><text x="128" y="596" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#2a2118">and that he shall be back “in this very room</text><text x="128" y="650" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#2a2118">of the Reform Club” on</text><text x="128" y="738" font-family="'Source Sans 3', system-ui, sans-serif" font-size="50" fill="#2a2118" font-weight="600">Saturday 21 December 1872 · 8:45 pm</text><line x1="128" y1="824" x2="768" y2="824" stroke="#2a2118" stroke-width="2"/><text x="128" y="916" font-family="'Source Sans 3', system-ui, sans-serif" font-size="96" fill="#2a2118" font-weight="600">£20,000</text><text x="528" y="916" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#5b4a3a" font-style="italic">at Baring’s</text><line x1="128" y1="946" x2="768" y2="946" stroke="#2a2118" stroke-width="2"/><circle cx="990" cy="848" r="96" fill="none" stroke="#b03a2e" stroke-width="5"/><circle cx="990" cy="848" r="84" fill="none" stroke="#b03a2e" stroke-width="1.5"/><text x="990" y="870" font-family="'Playfair Display', Georgia, serif" font-size="84" fill="#b03a2e" font-weight="700" text-anchor="middle">80</text><text x="990" y="906" font-family="'Source Sans 3', system-ui, sans-serif" font-size="24" fill="#b03a2e" font-weight="600" text-anchor="middle" letter-spacing="6">DAYS</text><line x1="1150" y1="350" x2="1150" y2="960" stroke="#2a2118" stroke-width="1.5"/><text x="1220" y="372" font-family="'Source Sans 3', system-ui, sans-serif" font-size="26" fill="#5b4a3a" font-weight="600" letter-spacing="4">Signed — Stuart first, Fogg last</text><text x="1220" y="462" font-family="'Playfair Display', Georgia, serif" font-size="40" fill="#2a2118" font-style="italic">Andrew Stuart</text><text x="1800" y="462" font-family="'Source Sans 3', system-ui, sans-serif" font-size="22" fill="#5b4a3a" text-anchor="end">engineer</text><line x1="1220" y1="478" x2="1800" y2="478" stroke="#2a2118" stroke-width="1" opacity="0.55"/><text x="1220" y="550" font-family="'Playfair Display', Georgia, serif" font-size="40" fill="#2a2118" font-style="italic">John Sullivan</text><text x="1800" y="550" font-family="'Source Sans 3', system-ui, sans-serif" font-size="22" fill="#5b4a3a" text-anchor="end">banker</text><line x1="1220" y1="566" x2="1800" y2="566" stroke="#2a2118" stroke-width="1" opacity="0.55"/><text x="1220" y="638" font-family="'Playfair Display', Georgia, serif" font-size="40" fill="#2a2118" font-style="italic">Samuel Fallentin</text><text x="1800" y="638" font-family="'Source Sans 3', system-ui, sans-serif" font-size="22" fill="#5b4a3a" text-anchor="end">banker</text><line x1="1220" y1="654" x2="1800" y2="654" stroke="#2a2118" stroke-width="1" opacity="0.55"/><text x="1220" y="726" font-family="'Playfair Display', Georgia, serif" font-size="40" fill="#2a2118" font-style="italic">Thomas Flanagan</text><text x="1800" y="726" font-family="'Source Sans 3', system-ui, sans-serif" font-size="22" fill="#5b4a3a" text-anchor="end">brewer</text><line x1="1220" y1="742" x2="1800" y2="742" stroke="#2a2118" stroke-width="1" opacity="0.55"/><text x="1220" y="814" font-family="'Playfair Display', Georgia, serif" font-size="40" fill="#2a2118" font-style="italic">Gauthier Ralph</text><text x="1800" y="814" font-family="'Source Sans 3', system-ui, sans-serif" font-size="22" fill="#5b4a3a" text-anchor="end">Bank of England</text><line x1="1220" y1="830" x2="1800" y2="830" stroke="#2a2118" stroke-width="1" opacity="0.55"/><text x="1220" y="902" font-family="'Playfair Display', Georgia, serif" font-size="40" fill="#2a2118" font-style="italic">Phileas Fogg</text><text x="1800" y="902" font-family="'Source Sans 3', system-ui, sans-serif" font-size="22" fill="#5b4a3a" text-anchor="end">No. 7 Savile Row</text><line x1="1220" y1="918" x2="1800" y2="918" stroke="#2a2118" stroke-width="1" opacity="0.55"/><text x="960" y="1000" font-family="'Source Sans 3', system-ui, sans-serif" font-size="26" fill="#5b4a3a" text-anchor="middle">Eighty days: 1,920 hours, or 115,200 minutes.</text></svg>
