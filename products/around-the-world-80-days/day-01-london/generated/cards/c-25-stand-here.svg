<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Stand here. Every LONDON on a British road sign means this spot.">
<title>C-25 — Stand here. Every LONDON on a British road sign means this spot.</title>
<rect width="1920" height="1080" fill="#efe6d3"/>
<rect x="56" y="56" width="1808" height="968" fill="none" stroke="#2a2118" stroke-width="4"/>
<rect x="68" y="68" width="1784" height="944" fill="none" stroke="#2a2118" stroke-width="1"/>
<text x="960" y="284" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="166" font-weight="600" fill="#2a2118">Stand here. Every</text>
<text x="960" y="490" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="166" font-weight="600" fill="#2a2118">LONDON on a British</text>
<text x="960" y="696" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="166" font-weight="600" fill="#2a2118">road sign means</text>
<text x="960" y="902" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="166" font-weight="600" fill="#2a2118">this spot.</text>
