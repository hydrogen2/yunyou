  #g07 .item.wrong .tile{stroke:#b03a2e;stroke-dasharray:14 10} #g07 .item.in .tile{stroke:#2a2118} #g07 .item.in{cursor:default}
  #g07 .item.drag{cursor:grabbing} #g07 #close-btn{cursor:pointer} #g07 #close-btn:focus{outline:none} #g07 #close-btn:focus rect,#g07 #close-btn:hover rect{fill:#b03a2e;stroke:#b03a2e} #g07 #close-btn:focus text,#g07 #close-btn:hover text{fill:#efe6d3}
  #g07 #bag.over #bag-body{stroke:#b03a2e;stroke-width:10}
</style>
