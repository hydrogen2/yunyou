<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2176 1812" width="2176" height="1812" role="img" aria-label="Cook · Train — TWO REAL MEN WERE DOING IT">
<title>Cook · Train — TWO REAL MEN WERE DOING IT</title>
<style>text{font-kerning:normal} .row rect.hit{fill:#2a2118;fill-opacity:0;cursor:pointer} .row:hover rect.hit,.row:focus rect.hit{fill-opacity:.07} .row:focus{outline:none}</style>
<rect width="2176" height="1812" fill="#efe6d3"/>
<rect x="72" y="72" width="2032" height="1668" fill="none" stroke="#2a2118" stroke-width="4"/><rect x="84" y="84" width="2008" height="1644" fill="none" stroke="#2a2118" stroke-width="1"/><text x="1088" y="200" font-family="'Source Sans 3', system-ui, sans-serif" font-size="32" fill="#5b4a3a" font-weight="600" text-anchor="middle" letter-spacing="10">TWO REAL MEN WERE DOING IT</text><text x="1088" y="320" font-family="'Playfair Display', Georgia, serif" font-size="112" fill="#2a2118" font-weight="700" text-anchor="middle">Cook · Train</text><text x="1088" y="388" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#5b4a3a" text-anchor="middle">Round the world as Verne wrote — both going west</text><line x1="168" y1="436" x2="2008" y2="436" stroke="#b03a2e" stroke-width="5"/><line x1="1088" y1="520" x2="1088" y2="1530" stroke="#2a2118" stroke-width="2"/><text x="152" y="560" font-family="'Playfair Display', Georgia, serif" font-size="68" fill="#2a2118" font-weight="700">Thomas Cook</text><text x="152" y="610" font-family="'Source Sans 3', system-ui, sans-serif" font-size="32" fill="#5b4a3a" font-style="italic">the first commercial round-the-world tour</text><text x="152" y="680" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">26 September 1872</text><text x="152" y="728" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">sails from Liverpool</text><line x1="152" y1="750" x2="1008" y2="750" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="152" y="812" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">2 October 1872</text><text x="152" y="860" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">mid-Atlantic — the day Fogg leaves London</text><line x1="152" y1="882" x2="1008" y2="882" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="152" y="950" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#5b4a3a">New York → across America → Yokohama → Asia → home</text><line x1="152" y1="972" x2="1008" y2="972" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="152" y="1040" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#5b4a3a">letters home to The Times</text><line x1="152" y1="1062" x2="1008" y2="1062" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="152" y="1124" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">222 days</text><text x="152" y="1172" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">nearly 48,000 km (30,000 miles)</text><line x1="152" y1="1194" x2="1008" y2="1194" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="1168" y="560" font-family="'Playfair Display', Georgia, serif" font-size="68" fill="#2a2118" font-weight="700">George Francis Train</text><text x="1168" y="610" font-family="'Source Sans 3', system-ui, sans-serif" font-size="32" fill="#5b4a3a" font-style="italic">American — and, he said, the real Fogg</text><text x="1168" y="680" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">10 July 1870</text><text x="1168" y="728" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">leaves New York</text><line x1="1168" y1="750" x2="2024" y2="750" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="1168" y="812" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">1 August 1870</text><text x="1168" y="860" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">sails from San Francisco</text><line x1="1168" y1="882" x2="2024" y2="882" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="1168" y="944" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">26 August 1870</text><text x="1168" y="992" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">Yokohama</text><line x1="1168" y1="1014" x2="2024" y2="1014" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="1168" y="1076" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">22 October 1870</text><text x="1168" y="1124" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">Marseille — then jailed in Lyon</text><line x1="1168" y1="1146" x2="2024" y2="1146" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="1168" y="1208" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">21 December 1870</text><text x="1168" y="1256" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">home — Fogg’s date, two years early</text><line x1="1168" y1="1278" x2="2024" y2="1278" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="1168" y="1340" font-family="'Source Sans 3', system-ui, sans-serif" font-size="40" fill="#2a2118" font-weight="600">164 days</text><text x="1168" y="1388" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118">he claimed 80 “travelling” days</text><line x1="1168" y1="1410" x2="2024" y2="1410" stroke="#2a2118" stroke-width="1" stroke-dasharray="2 8" opacity="0.6"/><text x="1168" y="1476" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#2a2118" font-style="italic">He later claimed: “Verne stole my thunder. I’m Phileas Fogg.”</text><text x="1168" y="1536" font-family="'Source Sans 3', system-ui, sans-serif" font-size="30" fill="#5b4a3a">Later rounds: 67½ days (1890), 60 days (1892)</text><line x1="168" y1="1560" x2="2008" y2="1560" stroke="#2a2118" stroke-width="2"/><text x="1088" y="1650" font-family="'Source Sans 3', system-ui, sans-serif" font-size="64" fill="#2a2118" font-weight="600" text-anchor="middle">Cook 222 · Train 164 · Fogg 80</text><text x="1088" y="1700" font-family="'Source Sans 3', system-ui, sans-serif" font-size="30" fill="#5b4a3a" text-anchor="middle" letter-spacing="4">days round the world</text></svg>
