<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Champs-Élysées — a walk</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; color: #eee; }
  /* The Embed API has no switch for its own furniture, so the frame is hung larger than the window and its corners
     fall outside it: the address card and fullscreen button off the top, the compass and zoom buttons off the right.
     Google's logo and its "© Google / Terms" credit stay inside the window, as their terms require. Measured
     2026-09-18; the widgets sit at the same corner offsets whatever the window size. */
  #stage { position: fixed; left: 0; top: -84px; right: -64px; bottom: 0; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 0; transition: opacity 1s ease; }
  #stage iframe.on { opacity: 1; }
  /* The inset map is drawn from the route's own coordinates — no tiles, no second key, and it still draws where
     Google is blocked. North stays up, so the turn of the avenue reads as a real direction. */
  /* The Embed API has no switch for its own furniture, so the page covers it: the address card top-left, and the
     compass and zoom buttons on the right edge. Google's logo and Terms link are attribution and stay visible, as
     their terms require. Corner offsets are the same at every window size, measured 2026-09-18. */
  /* the chevrons painted on the road are part of the panorama itself and cannot be removed; this at least stops a
     stray touch or drag turning the view away from the walk */
  #shield { position: fixed; inset: 0; z-index: 4; }
  /* A real Google map, from the same free Embed API in "view" mode, held still while the marker moves over it. */
  #map { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px;   /* Google's address box sits top-left */
    z-index: 6; border-radius: 12px; overflow: hidden; background: #1a1a1c;
    border: 1px solid rgba(255,255,255,.22); box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #map iframe { display: block; border: 0; }
  @media (max-width: 620px) { #map { transform: scale(.62); transform-origin: top right; } }
  /* The marker is placed for a map held at one centre and zoom, so the map must not be panned or zoomed under it:
     the overlay takes every touch on the inset. */
  #mapsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #facing { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 8px; border-radius: 999px;
    background: rgba(12,12,14,.78); color: #eee; }   /* clear of Google's own controls and credits */
  .mp-road { fill: none; stroke: rgba(30,30,35,.3); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .mp-done { fill: none; stroke: #d98f2b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .mp-dot { fill: #fff; stroke: #1a1a1c; stroke-width: 1.5; }
  .mp-dot2 { fill: #d98f2b; }
  .mp-cone { fill: rgba(217,143,43,.5); stroke: rgba(255,255,255,.55); stroke-width: .5; }
  #title { position: fixed; left: 0; right: 0; top: 18%; text-align: center; z-index: 5; pointer-events: none;
    transition: opacity 1.4s ease; text-shadow: 0 2px 12px #000; }
  #title h1 { font: 600 clamp(22px, 4vw, 44px)/1.15 Georgia, "Noto Serif SC", serif; margin: 0 0 6px; }
  #title p { margin: 0; opacity: .85; font-size: clamp(13px, 1.8vw, 18px); }
  #bar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(720px, calc(100% - 24px)); z-index: 6; background: rgba(12,12,14,.72); backdrop-filter: blur(8px);
    border-radius: 12px; padding: 10px 14px; transition: opacity .5s ease; }
  #bar.hide { opacity: 0; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 10px; }
  button, select { background: rgba(255,255,255,.1); color: #eee; border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover, select:hover { background: rgba(255,255,255,.18); }
  #play { min-width: 44px; }
  #track { position: relative; flex: 1; height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; cursor: pointer; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #e8c170; border-radius: 3px; }
  .tick { position: absolute; top: -3px; width: 2px; height: 12px; background: rgba(255,255,255,.6); }
  #where { display: flex; justify-content: space-between; font-size: 12px; opacity: .75; margin-top: 7px; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9;
    text-align: center; padding: 24px; background: #000; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="shield"></div>
<div id="map"><iframe id="mapframe" title="Map of the avenue" referrerpolicy="no-referrer-when-downgrade"></iframe><svg id="mapsvg" aria-label="Where you are on the avenue"></svg><div id="facing"></div></div>
<div id="title"><h1>Avenue des Champs-Élysées</h1><p>Arc de Triomphe → Place de la Concorde · 1.8 km on foot</p></div>
<div id="bar">
  <div class="row">
    <button id="play" title="Play / pause (space)">⏸</button>
    <div id="track" title="Jump along the avenue"><div id="fill"></div></div>
    <select id="speed" title="Pace">
      <option value="180">3 min · a view every 3 s</option>
      <option value="300" selected>5 min · every 5 s</option>
      <option value="480">8 min · every 8 s</option>
    </select>
    <button id="full" title="Fullscreen">⛶</button>
  </div>
  <div id="where"><span id="dist">0.00 / 1.80 km</span><span id="near">Arc de Triomphe</span></div>
</div>
<div id="msg"></div>

<script>
/*
 * The free Maps Embed API version. drive.html is the JavaScript API one (needs that API enabled on the key).
 * An auto-walk down the Champs-Élysées in Google Street View, on the Maps Embed API — the free, unlimited one
 * (founder's RULE 1: no Google API cost; the key is enabled for the Embed API only). The Embed API cannot be driven
 * like the JavaScript API, but its URL carries location and heading, so the walk swaps the iframe's src one step at
 * a time. Two stacked iframes cross-fade so each reload reads as a dissolve instead of a flash — the same trick the
 * Day 1 player used.
 *
 * The route is the avenue's real centreline from OpenStreetMap, resampled every STEP metres and nudged a few metres
 * to the right of the direction of travel, so successive panoramas stay on the eastbound side instead of flipping
 * between carriageways. The key is read from /config.json at runtime and is never written into this file.
 */
const LINE = [ // OSM ways 626668696, 635793356, 635793354, 4294035, 69414167, 105177511 — Arc → Concorde
  [48.8726107, 2.2987107], [48.8720562, 2.3004567], [48.8704451, 2.3051436], [48.8691810, 2.3091111],
  [48.8689063, 2.3103410], [48.8677540, 2.3139627], [48.8663005, 2.3185313], [48.8656393, 2.3208526]];
const STEP = 30;          // metres between views: far enough that each is a real step forward, few enough to load well
const OFFSET_R = 6;       // metres to the right of travel, to hold the eastbound carriageway
const LOOK_AHEAD = 2;     // aim the camera at the point 2 steps (60 m) ahead, so the heading does not wobble
const SETTLE_MS = 1800;   // after the iframe loads, let the blurry first tiles sharpen before it is shown
const MIN_DWELL = 2500;   // every view stays fully on screen at least this long
const ARC_AT = [48.8738, 2.2950], OBELISK = [48.86551, 2.32117];
const LANDMARKS = [ { name: 'Arc de Triomphe', at: [48.8738, 2.2950] },
                   { name: 'Rond-Point des Champs-Élysées', at: [48.8689063, 2.3103410] },
                   { name: 'Place de la Concorde', at: [48.8656393, 2.3208526] } ];

const R = 6371008.8, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLa = rad(b[0] - a[0]), dLo = rad(b[1] - a[1]);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b[1] - a[1])) * Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0])) * Math.sin(rad(b[0])) - Math.sin(rad(a[0])) * Math.cos(rad(b[0])) * Math.cos(rad(b[1] - a[1]));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function dest(p, brg, m) {
  const d = m / R, t = rad(brg), la = rad(p[0]), lo = rad(p[1]);
  const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(t));
  const lo2 = lo + Math.atan2(Math.sin(t) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
  return [deg(la2), deg(lo2)];
}

// resample the line every STEP metres
const samples = [];
let total = 0;
{
  let carry = 0;
  for (let i = 0; i + 1 < LINE.length; i++) {
    const a = LINE[i], b = LINE[i + 1], seg = dist(a, b), brg = bearing(a, b);
    let s = carry;
    while (s < seg) { samples.push({ p: dest(a, brg, s), along: total + s, brg }); s += STEP; }
    carry = s - seg; total += seg;
  }
  samples.push({ p: LINE[LINE.length - 1], along: total, brg: bearing(LINE[LINE.length - 2], LINE[LINE.length - 1]) });
}
const stops = samples.map((s, i) => {
  const ahead = samples[Math.min(samples.length - 1, i + LOOK_AHEAD)];
  const heading = i + LOOK_AHEAD < samples.length ? bearing(s.p, ahead.p) : s.brg;
  return { p: dest(s.p, (s.brg + 90) % 360, OFFSET_R), heading, along: s.along };
});
// open by looking back at the Arc, then turn round and set off
const arc = ARC_AT;
stops.unshift({ p: stops[0].p, heading: bearing(stops[0].p, arc), along: 0, hold: 3000, label: 'Looking back at the Arc de Triomphe' });
// finish facing the obelisk at the centre of the Place de la Concorde
stops.push({ p: stops[stops.length - 1].p, heading: bearing(stops[stops.length - 1].p, OBELISK), along: total, hold: 1e9 });

// Every stop is pinned to one Google car panorama, chosen by hand on 2026-09-17. Asked for a bare location, the embed
// serves whatever photo is nearest, and on this avenue that is often a visitor's photosphere (inside a shop, at night)
// or a winter drive among summer ones. Each pin below is Google's own imagery, on the carriageway, in daylight, in
// leaf, and in order down the avenue. Keys are indexes into stops above (look-back = 0, STEP = 30 m); a stop with no
// pin had no good panorama and is skipped. Re-survey if STEP or LINE changes.
const PINNED = {
  0: 'jBZ00nGPrGkZ1FlTlywtmw', 1: 'jBZ00nGPrGkZ1FlTlywtmw', 2: 'C2H8XJMkSK8550KWBJl3GA', 3: 'H1zqhJQsAFytCMLKaCZoNg',
  4: '4cJBPiZ3fHv5XgHMVYfyMQ', 5: 'T7mjlUAnugPgGrp14tLAdw', 6: 'lvtevDIDr3T7cPu7hm_HTQ', 7: 'cAO6W5xpMfGj8m2V93fGYQ',
  8: '_MfZHdtZ5FziYcZOWtlQOw', 9: '-Z4px5m6M4vXDAVGr15_Ag', 10: 'hTftEZv6JjY9JLWKJ99qRg', 11: 'IQr87B3nq2-M3ZO6urZgLQ',
  12: 'gfu-pz4w6n-8BaFAU4RKLw', 13: 'ABVxgBfAN4Mx3t9cTfDLwA', 14: '6yltnYdHm6rdLuAYz3L4rQ', 15: 'pNYdl5rf6vhQ66jEjNp8Yg',
  16: 'MMjE1tISMDcJcdgYKd-xpw', 17: 'IGb0t_5OcN4huq5ID5gdsg', 18: 'mG197IFpSXGfuTFg2H2wGA', 20: '61rKGwSN2TpGyVWI5dzb6w',
  21: 'NA9w6c5r_mgDTW1Ng5aqJw', 23: 'mfnQHcvXYSbTudmCZymQeQ', 24: 'z-gagDDU1ArqLfpXKFpHng', 25: 'sA4uM6uwQ5ICvNrVbNZq-A',
  26: 'WiBhZON783cc0lC7gV0EUA', 27: 'jhQAh69lUX8SNQ7FvG75Nw', 28: 'i7xbMYeAXC9GkJMzNPAMMQ', 29: 'iEq0qQowRFP7bEhLBHVrzg',
  30: '0f5GLXIdIaqlRcqpmziysg', 31: 'Ltjeff8m9zqgRjyZwqpykw', 32: 'fm75qxnzZbxgRO1-uEEBaw', 33: 'rdZVec_O3I6feZUUJVA31Q',
  34: 'tEVfYuwTiUrWnX23Xu1pSQ', 35: 'pGn3w6SK8mfBhlk6qjRzJw', 36: 'ngamPNEk-LozItgxbV5EKQ', 37: 'u2C4XamLnGv95uPO8aQDUQ',
  38: 'vA26xJbDEfFOPYntNSt37g', 39: 'LG8bJ_RGeCCyvH66VP9-ug', 40: 'CbgDbOjOpvqJyHMcLUBVog', 41: 'qgE3XkkTHzNFKSMsEL0JBA',
  42: '8o2xwSqJKWvbyHxKD_nl4g', 43: 'ZLEjmDb5qaR2z_tn5F-o7g', 44: 'fVk9LzhfPO0dAr1QRfJSag', 45: '2hQHPDw4sQdZLXynaq5ARg',
  46: 'g75mtxgArF-W7J-z8Wfcbw', 47: '3HbfOcUJU-C1cDoKQ3zfYA', 48: 'VIYwm0SkqjCMB7InrCC4rg', 49: '85kInX6waE2lUNda_fhsSA',
  50: 'QUfhEtppcyr8KBKjnxR-bA', 51: 'oMU3fbRtFo1Nv6YsknUffA', 52: 'iqH9A4DhVliprPYVHxkRaw', 53: 'tBqOlsni5QEYySCITCKjdw',
  54: '0RxuxS8pIEuNUtVGldMfWg', 55: 'q1dbnFLF3RGfh6CtXMIJgQ', 56: 'vhI1n4Q86u_c82wBdCsoug', 57: 'ZsHqcp2Q6HLMb2nkgA-_LQ',
  58: 'FVINsMejDQjy9u4EB3HbIw', 59: 'yeAZn_F8LLiGOjrlzexoPQ', 60: 'L0mS00svPXvjA8WDVWMVOw', 61: 'dq_gmxQFc9lFRxal3SjXkQ',
  62: '-psxMnV-6XBPcA4ViSlFIg'
};
for (let i = stops.length - 1; i >= 0; i--) { if (PINNED[i]) stops[i].pano = PINNED[i]; else stops.splice(i, 1); }

const $ = id => document.getElementById(id);
const stage = $('stage'), fill = $('fill');
let key = null, frames = [], cur = 0, idx = 0, playing = true, lastStepAt = 0, durS = 300, driveStart = 0;

function url(s) {
  return 'https://www.google.com/maps/embed/v1/streetview?key=' + encodeURIComponent(key) +
    (s.pano ? '&pano=' + s.pano : '&location=' + s.p[0].toFixed(6) + ',' + s.p[1].toFixed(6)) +
    '&heading=' + Math.round(s.heading) + '&pitch=0&fov=90';
}
// The next view loads in the hidden iframe as soon as the current one is up, and is only revealed once it has loaded
// and sharpened. It fades in ON TOP of the current view, which stays fully opaque underneath until the fade is done,
// so there is never a moment where both are half-transparent over the black page.
let ready = false, gen = 0, z = 1, shownAt = 0, pending = 0;
function preload(i) {
  const g = ++gen, next = frames[1 - cur];
  ready = false; pending = Math.max(0, Math.min(stops.length - 1, i));
  next.onload = () => { next.onload = null; setTimeout(() => { if (g === gen) ready = true; }, SETTLE_MS); };
  next.src = url(stops[pending]);
}
function reveal(now) {
  const next = frames[1 - cur], prev = frames[cur];
  next.style.zIndex = ++z; next.classList.add('on');
  cur = 1 - cur; idx = pending; shownAt = now; ready = false; paint();
  setTimeout(() => prev.classList.remove('on'), 1100);
  if (idx < stops.length - 1) setTimeout(() => preload(idx + 1), 1100);
}
// The inset is a real Google map — the same free Embed API, in "view" mode — fixed over the avenue while the marker
// moves across it. The map itself never reloads: the marker's pixel position comes from the same Web Mercator
// projection Google draws with, so a coordinate lands on the street drawn under it.
const MAP_W = 330, MAP_H = 200, MAP_PAD = 8;   // the avenue needs 305 px across at the close zoom, so the box grants it
const mercX = q => (q[1] + 180) / 360;
const mercY = q => { const t = Math.sin(rad(q[0])); return 0.5 - Math.log((1 + t) / (1 - t)) / (4 * Math.PI); };
const mpts = [...LINE, ARC_AT, OBELISK];
const mid = f => (Math.min(...mpts.map(f)) + Math.max(...mpts.map(f))) / 2;
const mCenter = [mid(q => q[0]), mid(q => q[1])];
const span = f => Math.max(...mpts.map(f)) - Math.min(...mpts.map(f));
// The embed takes whole zoom levels only, and one level out halves the detail, so take the tightest level at which
// the avenue still fits the box — the box above is sized so that level is the close one.
const fit = Math.log2(Math.min((MAP_W - 2 * MAP_PAD) / (span(mercX) * 256), (MAP_H - 2 * MAP_PAD) / (span(mercY) * 256)));
const MAP_Z = Math.floor(fit) + (Math.pow(2, Math.floor(fit) + 1) * span(mercX) * 256 <= MAP_W - 2 * MAP_PAD &&
                                 Math.pow(2, Math.floor(fit) + 1) * span(mercY) * 256 <= MAP_H - 2 * MAP_PAD ? 1 : 0);
const world = 256 * Math.pow(2, MAP_Z);
const PX = q => MAP_W / 2 + (mercX(q) - mercX(mCenter)) * world;
const PY = q => MAP_H / 2 + (mercY(q) - mercY(mCenter)) * world;
let mpLen = 0;
function drawMap() {
  const f = $('mapframe');
  f.width = MAP_W; f.height = MAP_H;
  $('map').style.width = MAP_W + 'px'; $('map').style.height = MAP_H + 'px';
  f.src = 'https://www.google.com/maps/embed/v1/view?key=' + encodeURIComponent(key) +
    '&center=' + mCenter[0].toFixed(6) + ',' + mCenter[1].toFixed(6) + '&zoom=' + MAP_Z + '&maptype=roadmap';
  const d = 'M' + LINE.map(q => PX(q).toFixed(1) + ' ' + PY(q).toFixed(1)).join('L');
  $('mapsvg').setAttribute('viewBox', '0 0 ' + MAP_W + ' ' + MAP_H);
  $('mapsvg').innerHTML = '<path class="mp-road" d="' + d + '"/><path class="mp-done" id="mpdone" d="' + d + '"/>' +
    '<g id="mphere"><polygon class="mp-cone" points="0,0 -12,-30 12,-30"/>' +
    '<circle class="mp-dot" r="5.5"/><circle class="mp-dot2" r="2.5"/></g>';
  mpLen = $('mpdone').getTotalLength();
}
function paintMap(s) {
  if (!mpLen) return;
  $('mpdone').style.strokeDasharray = (mpLen * s.along / total).toFixed(1) + ' ' + mpLen.toFixed(1);
  $('mphere').setAttribute('transform', 'translate(' + PX(s.p).toFixed(1) + ',' + PY(s.p).toFixed(1) + ') rotate(' + Math.round(s.heading) + ')');
  const pts = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
  $('facing').textContent = 'facing ' + pts[Math.round(s.heading / 45) % 8] + ' · ' + Math.round(s.heading) + '°';
}
function paint() {
  const s = stops[idx];
  fill.style.width = (100 * s.along / total).toFixed(2) + '%';
  $('dist').textContent = (s.along / 1000).toFixed(2) + ' / ' + (total / 1000).toFixed(2) + ' km';
  let near = LANDMARKS[0].name, best = Infinity;
  for (const l of LANDMARKS) { const d = dist(s.p, l.at); if (d < best) { best = d; near = l.name; } }
  $('near').textContent = s.label || (best < 160 ? near : 'towards Place de la Concorde');
  paintMap(s);
}
function tick(now) {
  if (playing && ready && key && now - shownAt >= MIN_DWELL) {
    const due = pending === 0 ? 0 : idx === 0 ? lastStepAt + stops[0].hold
      : driveStart + stops[pending].along / total * durS * 1000;
    if (now >= due) { if (idx === 0) driveStart = now - stops[pending].along / total * durS * 1000; reveal(now); }
  }
  requestAnimationFrame(tick);
}

// controls
function setPlaying(v) { playing = v; $('play').textContent = v ? '⏸' : '▶'; if (v) rebase(); }
$('play').onclick = () => setPlaying(!playing);
// keep the current place on the avenue when the clock restarts (resume, pace change, jump)
function rebase(along = stops[idx].along) { const now = performance.now(); lastStepAt = now; driveStart = now - along / total * durS * 1000; }
$('speed').onchange = e => { durS = +e.target.value; rebase(); };
$('track').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect(), want = (e.clientX - r.left) / r.width * total;
  let best = 1; for (let i = 1; i < stops.length; i++) if (Math.abs(stops[i].along - want) < Math.abs(stops[best].along - want)) best = i;
  preload(best); rebase(stops[best].along); shownAt = 0;
};
$('full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } });
// the bar fades away while you watch and comes back when you move
let hideT; const wake = () => { $('bar').classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => $('bar').classList.add('hide'), 6000); };
['mousemove', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));
// keep a phone screen awake for the length of the walk
async function stayAwake() { try { await navigator.wakeLock?.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') stayAwake(); });

(async function start() {
  try { key = (await (await fetch('/config.json', { cache: 'no-store' })).json()).maps_api_key; } catch (e) {}
  if (!key) { const m = $('msg'); m.style.display = 'flex'; m.textContent = 'No Maps key found in /config.json.'; return; }
  for (let k = 0; k < 2; k++) {
    const f = document.createElement('iframe');
    f.setAttribute('allowfullscreen', ''); f.setAttribute('loading', 'eager');
    f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    stage.appendChild(f); frames.push(f);
  }
  drawMap();
  frames[0].classList.add('on');
  frames[0].src = url(stops[0]); lastStepAt = performance.now(); shownAt = lastStepAt; paint();
  frames[0].onload = () => { frames[0].onload = null; lastStepAt = performance.now(); preload(1); };
  setTimeout(() => { $('title').style.opacity = 0; }, 4500);
  wake(); stayAwake(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
