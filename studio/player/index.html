<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yunyou · player</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink:#ece6da; --dim:#a9a193; --bg:#0d0c0e; --panel:#17161a; --line:#2b292f; --accent:#d9a441; --ok:#7bc47f; --bad:#e07a6a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.45 Georgia,'Times New Roman',serif; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif; font-size:13px; color:var(--dim); }
  header b { color:var(--ink); font-weight:600; }
  header .sp { flex:1; }
  header button, .btn { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#1a1408; border-color:var(--accent); font-weight:600; }
  #stage { flex:1; min-height:0; display:flex; flex-direction:column; }
  #media { position:relative; flex:1 1 55%; min-height:34vh; background:#000; overflow:hidden; }
  #media iframe, #media img, #media video, #media .fill { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #media img { object-fit:contain; }
  /* ---- v0.7 · the image treatment layer -------------------------------------------------------------------
     Many of our pictures are portrait photographs or small archive plates (474–760 px). Dropped into a 16:9 frame
     with object-fit:contain they sat in wide black bars and read as a GAP rather than a choice. Three treatments,
     picked from the file's real pixels and the real frame (see pickTreatment in the script):
       fill      the picture already fills this frame at honest size — contain, nothing added
       backdrop  the bars are filled with an ambient, heavily blurred, darkened copy OF THE SAME PICTURE
       plate     small period engravings, elevations and plans are mounted on warm paper with a caption line,
                 sized to their real pixels — a document on a table, not a small floating rectangle
     and three things none of them ever do: stretch, upscale past the file's own pixels, or crop the subject away.
     The drift starts BELOW 100 % and ends at 100 %, so the motion can never invent resolution. */
  #media .imgstage { position:absolute; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#000; }
  /* The ambient layer is drawn at a TENTH of the frame and scaled back up: a 36-px blur over 768x620 costs a
     ~200 ms one-off rasterisation on a software renderer, and the same blur over 77x62 costs almost nothing —
     a heavy blur throws that detail away anyway, so there is nothing to lose. --yy-blur is the LOCAL radius. */
  #media .imgstage .imgback { position:absolute; inset:auto; left:0; top:0; width:10%; height:10%;
        object-fit:cover; object-position:center; transform-origin:0 0; transform:scale(12.5) translate(-10%,-10%);
        filter:blur(var(--yy-blur,3.6px)) saturate(1.12) brightness(.44);
        opacity:0; transition:opacity .7s ease-out; }
  #media .imgstage .imgback.on { opacity:1; }
  #media .imgstage .imgveil { position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(ellipse at 50% 44%, rgba(0,0,0,0) 30%, rgba(6,5,8,.5) 100%); }
  #media .imgstage .imgmain { position:relative; inset:auto; width:auto; height:auto; max-width:100%; max-height:100%;
        object-fit:contain; background:transparent; display:block; }
  #media .imgstage[data-treatment="backdrop"] .imgmain { box-shadow:0 18px 60px rgba(0,0,0,.55); }
  /* the paper mount: an engraving is a document, so it is presented as one */
  #media .imgplate { position:relative; margin:0; display:flex; flex-direction:column; gap:.55em; max-width:100%; max-height:100%;
        padding:var(--yy-pad,20px); background:linear-gradient(163deg,#f7f0de 0%,#f0e6ce 55%,#e6dabc 100%); color:#3a2f22;
        border:1px solid rgba(58,44,26,.34); border-radius:3px;
        box-shadow:0 26px 72px rgba(0,0,0,.62), 0 1px 0 rgba(255,255,255,.35) inset; }
  #media .imgplate .imgmain { border:1px solid rgba(58,44,26,.42); }
  #media .imgplate .imgcredit { position:static; max-width:100%; background:none; color:#5d4c37; padding:0; border-radius:0;
        font:italic clamp(10.5px,1.5vmin,13px)/1.35 Georgia,'Times New Roman',serif; text-align:left; text-shadow:none; }
  #media .imgcredit { position:absolute; right:8px; bottom:6px; z-index:3; max-width:68%; text-align:right;
        font:11.5px/1.45 system-ui,sans-serif; color:var(--ink); background:rgba(8,7,10,.66); padding:3px 8px; border-radius:5px;
        text-shadow:0 1px 2px rgba(0,0,0,.65); }
  /* a Fold cover is 280 px: a right-aligned 68 %-wide credit becomes a six-line column over half the picture.
     Below 420 px it is a full-width label along the bottom instead — the same words, a third of the height. */
  @media (max-width:420px) { #media .imgcredit { left:6px; right:6px; bottom:5px; max-width:none; text-align:left; font-size:10.5px; } }
  /* an inset and its credit are ONE box, so the credit cannot drift onto the picture as the frame changes */
  #media .imginsetwrap { position:absolute; inset:auto; right:2vmin; bottom:2vmin; width:22%; min-width:120px; z-index:3; margin:0;
        display:flex; flex-direction:column; gap:3px; }   /* 22 % of a 280-px Fold is 62 px — too small to see and far too narrow for a credit */
  #media .imginsetwrap .imginset { position:static; inset:auto; width:100%; height:auto; display:block;
        border-radius:6px; border:1px solid rgba(246,239,220,.3); box-shadow:0 10px 30px rgba(0,0,0,.65); }
  #media .imginsetcap { text-align:right; color:var(--ink); font:10.5px/1.35 system-ui,sans-serif;
        text-shadow:0 1px 2px rgba(0,0,0,.9); pointer-events:none; }
  /* gentle motion: 0.94 → 1.00 of the honest size over 36 s, and back. Never above 1.00 — that would be upscaling. */
  @keyframes yy-drift { from { transform:scale(var(--kb-from,.94)) translate(var(--kb-dx,0%),var(--kb-dy,0%)); }
                        to   { transform:scale(1) translate(0,0); } }
  #media .drift { animation:yy-drift var(--kb-s,36s) ease-in-out infinite alternate; will-change:transform; }
  @media (prefers-reduced-motion: reduce) { #media .drift { animation:none; } }
  #media img.kenburns { object-fit:contain; }   /* legacy alias: the crop-to-cover Ken Burns is gone — it cut the subject away */
  #media .fill { display:flex; align-items:center; justify-content:center; padding:5vmin; text-align:center; }
  .card { background:linear-gradient(160deg,#f4ecd8,#e7dcc0); color:#2a2118; border-radius:14px; padding:6vmin 7vmin; max-width:820px; box-shadow:0 20px 60px rgba(0,0,0,.6); font-size:clamp(15px,2.4vmin,22px); text-align:left; }
  .card h2 { margin:0 0 .5em; font-weight:600; font-size:1.25em; letter-spacing:.02em; }
  .card small { color:#6b5a48; font-family:system-ui,sans-serif; }
  #overlays { min-height:2.4em; padding:6px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--line); background:var(--panel); font-family:system-ui,sans-serif; font-size:13px; }
  .pin { border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:2px 10px; }
  .cap { color:var(--ink); }
  .fact { color:var(--dim); font-style:italic; }
  .gloss { border:1px dashed var(--accent); background:#221c10; color:var(--ink); border-radius:999px; padding:3px 10px; font:inherit; cursor:pointer; }
  .gloss:focus-visible { outline:2px solid var(--accent); }
  #who { position:fixed; inset:0; z-index:20; background:rgba(6,5,8,.62); display:flex; align-items:center; justify-content:center; padding:4vmin; }
  #who[hidden] { display:none; }
  #who .card { max-height:86vh; overflow:auto; max-width:640px; }
  #who .card p { margin:.5em 0; }
  #who small.src { display:none; } /* F-ids stay in the JSON for reviewers; never shown to the traveller */
  #panel { flex:0 1 auto; max-height:46%; overflow:auto; padding:10px 14px 14px; }
  #title { font-family:system-ui,sans-serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
  #script { margin:0; font-size:clamp(15px,2.2vmin,19px); }
  #script .said { color:var(--ink); } #script .unsaid { color:var(--dim); }
  #interaction { margin-top:10px; font-family:system-ui,sans-serif; }
  .opt { display:block; width:100%; text-align:left; margin:6px 0; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--ink); font:inherit; cursor:pointer; }
  .opt.correct { border-color:var(--ok); } .opt.wrong { border-color:var(--bad); } .opt.picked { background:#221f26; }
  .fb { margin:6px 0 0; padding:8px 12px; border-left:3px solid var(--accent); color:var(--ink); }
  .chat { display:flex; flex-direction:column; gap:6px; }
  .chat .q { align-self:flex-end; background:#2a2730; padding:8px 12px; border-radius:12px 12px 2px 12px; max-width:85%; }
  .chat .a { align-self:flex-start; background:#1c2a1e; padding:8px 12px; border-radius:12px 12px 12px 2px; max-width:85%; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:6px 10px; background:var(--panel); color:var(--ink); cursor:pointer; font:inherit; font-size:14px; }
  footer { display:flex; gap:8px; align-items:center; padding:8px 12px; border-top:1px solid var(--line); font-family:system-ui,sans-serif; font-size:13px; }
  #prog { flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; } #prog i { display:block; height:100%; width:0; background:var(--accent); transition:width .5s linear; }
  #cover { position:fixed; inset:0; background:radial-gradient(ellipse at 50% 30%, #241d14, #0d0c0e 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6vmin; z-index:10; }
  #cover h1 { font-weight:500; font-size:clamp(28px,6vmin,54px); margin:0 0 .2em; } #cover p { color:var(--dim); max-width:560px; }
  #cover label { font-family:system-ui,sans-serif; font-size:12px; color:var(--dim); display:block; margin-top:22px; }
  #cover input { background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 8px; width:min(90vw,420px); font:13px system-ui; }
  #cover select { background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 8px; font:13px system-ui; }
  #cover .btn { max-width:min(92vw,560px); white-space:normal; }   /* "Continue — scene 7: …" wraps instead of overflowing */
  #continue[hidden], #continueNote[hidden] { display:none; }
  .leaflet-container { background:#e9e2d0; }
  .genwrap { position:absolute; inset:0; background:#efe6d3; display:flex; align-items:center; justify-content:center; }
  .genwrap svg.gen { width:100%; height:100%; display:block; touch-action:none; }
  .genwrap svg.gen:focus-visible { outline:2px solid #b03a2e; outline-offset:-2px; }
  .genwrap svg.gen :focus:not(:focus-visible) { outline:none; } /* pointer taps on tabindex'd svg parts (bag, rows) must not draw the browser focus ring */
  #countdown { color:var(--accent); font-family:system-ui,sans-serif; font-size:12px; }
  .row-hl { pointer-events:none; }
  .muted { color:var(--dim); font-family:system-ui,sans-serif; font-size:13px; }
  /* Street View v0.4 (cinematic auto-walk). Chrome sits top-left/top-right and the cross-fade stops 30 px short of
     the bottom edge, so Google's logo and ©-line inside the pano / static frame are never covered (rights: M-37/38/39). */
  #media .svpano { position:absolute; inset:0; }
  #media .svstill { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .38s ease-in-out; }
  #media .svstill.on { opacity:1; }
  #media .svfade { position:absolute; left:0; right:0; top:0; bottom:30px; background:#000; opacity:0; pointer-events:none; z-index:2; transition:opacity .18s linear; }
  #media .svbar { position:absolute; left:8px; top:8px; z-index:3; display:flex; gap:6px; font-family:system-ui,sans-serif; }
  #media .svbar .btn { padding:4px 10px; font-size:14px; background:rgba(13,12,14,.72); }
  #media .svattr { position:absolute; right:8px; top:8px; z-index:3; font:11px/1.5 system-ui,sans-serif; color:var(--ink); background:rgba(13,12,14,.6); padding:2px 7px; border-radius:5px; }
  /* Street View v0.5 — mode `open`: our own cached KartaView / Mapillary frames. Unlike Google's imagery these are
     ours to store, to overlay and to put in the video, so the CC BY-SA credit is burned bottom-left over the frame. */
  #media .svopen { position:absolute; inset:0; background-color:#000; opacity:0; transition:opacity .5s linear; will-change:background-position,background-size; }
  #media .svopen.on { opacity:1; }
  #media .svgap { position:absolute; inset:0; display:none; }
  #media .svgap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #media .svgapnote { position:absolute; left:8px; bottom:8px; z-index:3; font:11px/1.5 system-ui,sans-serif; color:var(--ink); background:rgba(13,12,14,.6); padding:3px 8px; border-radius:5px; }
  #media .svcredit { position:absolute; left:8px; bottom:8px; z-index:3; font:11px/1.5 system-ui,sans-serif; color:var(--ink); background:rgba(13,12,14,.62); padding:3px 8px; border-radius:5px; max-width:72%; }
  #media .svcredit a { color:var(--accent); text-decoration:none; }
  @media (min-aspect-ratio: 4/3) { #stage { flex-direction:row; } #media { flex:1 1 60%; min-height:0; } #right { flex:1 1 40%; display:flex; flex-direction:column; min-width:0; } #panel { max-height:none; flex:1; } }

  /* ---- v0.6: pause, resume, the scene list ------------------------------------------------------------------
     The paused state is announced OUTSIDE the media box (rights: nothing of ours is ever drawn over a YouTube
     player or over Google's Street View attribution), in a strip above the footer. */
  #pausebar { display:flex; align-items:center; gap:10px; padding:9px 12px; border-top:1px solid var(--line);
              background:#1b1710; font-family:system-ui,sans-serif; font-size:13px; color:var(--ink); }
  #pausebar[hidden] { display:none; }
  #pausebar .t { flex:1; min-width:0; color:var(--dim); }
  #pausebar .t b { color:var(--ink); font-weight:600; }
  body.yy-paused #media .drift { animation-play-state:paused; }         /* the still's drift stops with everything else */
  body.yy-paused #media .svstill, body.yy-paused #media .svopen { transition:none; }
  body.yy-paused #prog i { transition:none; }
  #btnPause { min-width:5.4em; }
  /* the scene list: a side sheet on a wide screen, a bottom sheet on a narrow one */
  #list { position:fixed; inset:0; z-index:22; background:rgba(6,5,8,.6); display:flex; justify-content:flex-end;
          font-family:system-ui,sans-serif; }
  #list[hidden] { display:none; }
  #list .sheet { background:var(--panel); border-left:1px solid var(--line); width:min(430px,92vw); display:flex; flex-direction:column; max-height:100%; }
  #listHead { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
  #listHead h2 { margin:0; font:600 15px/1.3 system-ui,sans-serif; color:var(--ink); }
  #listHead .sub { display:block; font-weight:400; font-size:11.5px; color:var(--dim); letter-spacing:.02em; }
  #listBody { flex:1; overflow:auto; padding:6px; }
  .scn { display:flex; gap:10px; width:100%; text-align:left; background:transparent; border:0; border-radius:10px;
         color:var(--ink); font:inherit; padding:9px 10px; cursor:pointer; }
  .scn:hover { background:#201e25; }
  .scn:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .scn .n { color:var(--dim); font:12px/1.6 system-ui,sans-serif; font-variant-numeric:tabular-nums; min-width:2em; }
  .scn .t { flex:1; min-width:0; }
  .scn .t b { display:block; font:500 15px/1.3 system-ui,sans-serif; overflow-wrap:anywhere; }
  .scn .t small { color:var(--dim); font-size:11.5px; }
  .scn[aria-current="true"] { background:#241d12; }
  .scn[aria-current="true"] .t b { color:var(--accent); }
  .scn[aria-current="true"] .n::before { content:'▸ '; color:var(--accent); }
  @media (max-width:560px) { #list { align-items:flex-end; }
    #list .sheet { width:100%; max-height:82dvh; border-left:0; border-top:1px solid var(--line); border-radius:14px 14px 0 0; } }
  /* ---- narrow screens (a Fold cover is ~320 px, some are 280) : the chrome must not overflow ---- */
  header { flex-wrap:nowrap; }
  header b { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header .sp { flex:1 1 0; min-width:0; }
  header button { flex:none; }
  #clock { font-variant-numeric:tabular-nums; white-space:nowrap; }
  @media (max-width:520px) {
    header { gap:5px; padding:6px 8px; }
    header button, footer .btn { padding:6px 8px; }
    #hScene { display:none; }          /* the scene number lives in the list and the footer clock */
    .lbl { display:none; }             /* button labels collapse to their glyph */
    footer { gap:6px; padding:6px 8px; }
    #btnPause { min-width:0; }
    #pausebar { padding:8px; gap:8px; }
  }
</style>
</head>
<body>
<div id="cover">
  <div id="coverTitle"><h1>Yunyou 云游</h1><p>loading tour…</p></div>
  <button class="btn primary" id="continue" hidden style="font-size:18px;padding:12px 26px;margin-bottom:10px">▶ Continue</button>
  <p class="muted" id="continueNote" hidden style="margin:0 0 12px;font-size:12px"></p>
  <button class="btn primary" id="start" style="font-size:18px;padding:12px 26px">▶ Start the day</button>
  <label>Language / 语言 <select id="lang"><option value="en">English</option><option value="zh-Hans">简体中文</option></select></label>
  <label>Narration voice <select id="voice"></select> <select id="rate" title="narration speed"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option></select> <button class="btn" id="testVoice">test</button></label>
  <label style="cursor:pointer"><input type="checkbox" id="clearEn"> Clear English — simpler wording and a slightly slower voice, where the chapter provides it</label>
  <label id="gkeyRow">Google Maps API key (optional — enables live Street View; stored only in this browser)<br><input id="gkey" placeholder="AIza…"></label>
  <label id="gkeyOk" style="display:none">Street View: <b>enabled</b> <button class="btn" id="gkeyEdit" style="padding:2px 8px;font-size:11px">use my own key</button></label>
  <p class="muted" style="margin-top:18px">Dry-run player · YouTube embeds, Wikimedia Commons media, browser TTS. Generated cards/maps are rendered live from the scene text.</p>
</div>

<div id="app">
  <header><b id="hTitle">Yunyou</b><span id="hScene"></span><span class="sp"></span>
    <button id="btnWho" title="who's who — the people in this story" hidden>👥<span class="lbl"> who's who</span></button><button id="btnCap" title="captions">CC</button><button id="btnMute" title="narration on/off">🔈</button><button id="btnList" title="the scenes of this day" aria-haspopup="dialog" aria-expanded="false">☰<span class="lbl"> scenes</span></button></header>
  <div id="stage">
    <div id="media"></div>
    <div id="right">
      <div id="overlays"></div>
      <div id="panel"><p id="title"></p><p id="script"></p><div id="interaction"></div></div>
    </div>
  </div>
  <div id="pausebar" hidden><span class="t" id="pauseText"></span><button class="btn primary" id="pauseGo">▶ Go on</button></div>
  <footer><button class="btn" id="prev" title="the scene before">‹<span class="lbl"> Back</span></button><button class="btn" id="btnPause" title="pause / resume (spacebar)" aria-pressed="false">⏸<span class="lbl"> Pause</span></button><div id="prog"><i></i></div><span id="clock"></span><span id="countdown"></span><button class="btn primary" id="next" title="the next scene"><span class="lbl">Next </span>›</button></footer>
</div>

<div id="list" hidden role="dialog" aria-modal="true" aria-labelledby="listTitle">
  <div class="sheet">
    <div id="listHead"><h2 id="listTitle">The scenes<span class="sub" id="listSub"></span></h2><span class="sp" style="flex:1"></span><button class="btn" id="listClose" aria-label="close the scene list">Close</button></div>
    <div id="listBody" role="list"></div>
  </div>
</div>

<div id="who" hidden role="dialog" aria-modal="true" aria-labelledby="whoTitle">
  <div class="card"><h2 id="whoTitle">Who's who</h2><div id="whoBody"></div>
    <p style="margin-top:1em"><button class="btn primary" id="whoClose">Close</button></p></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const TOUR_URL=qs.get('tour')||'/products/around-the-world-80-days/day-01-london/tour.json';
const $=s=>document.querySelector(s);
let tour, scenes=[], idx=0, timer=null, t0=0, elapsed=0, paused=false, captions=true, narrate=true, ytPlayer=null, ytReady=false, bed=null, map=null;
const commonsCache={};
let LOCALE=null;                       // active locale object (null = English)
let started=false;                     // the cover is gone and a scene is running

// ---------- localStorage that cannot throw (private mode, disabled storage, sandboxed iframe) ----------
const LS={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
           set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
           del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

// ---------- pause / resume (v0.6) ----------
// One master switch, and everything that moves is under it: the scene clock (tick), the narration
// (speechSynthesis), the audio bed, YouTube, the Street View embed's timeline, the pano/Ken-Burns animation and
// the interaction countdown. Reasons stack, so a card opening or an interaction wait can never un-pause a stop the
// traveller asked for. Tone (studio/strategy/positioning.md): stopping is normal, the day simply waits.
const pauseReasons=new Set();                 // 'user' | 'away' | 'sheet' (list / who's-who) | 'wait' (interaction countdown)
const HARD=['user','away','sheet'];           // a traveller-facing stop: even the interaction countdown holds
function hardPaused(){ return HARD.some(r=>pauseReasons.has(r)); }
function pauseFor(r){ if(pauseReasons.has(r)) return; pauseReasons.add(r); applyPause(); }
function resumeFrom(r){ if(!pauseReasons.delete(r)) return; applyPause(); }

// ---------- Commons: File: page URL → direct file URL + its REAL pixel size ----------
// v0.7: we now ask for `size` as well as `url`, for two reasons.
//  1. The treatment layer needs the real pixels BEFORE the picture is on screen, so a 632-px engraving is mounted
//     as a plate rather than flashing up letterboxed and then re-laying out.
//  2. Commons will happily answer `iiurlwidth=1600` for a 632-px file: it reports thumbwidth 1600 and hands back
//     the ORIGINAL (`thumbnail_unscaled`). Believing that number is how a small plate ends up claiming a
//     resolution it does not have. When thumbwidth > width we take the file's own width/height as the truth.
async function commonsInfo(pageUrl, width=1600){
  const m=pageUrl.match(/File:(.+)$/); if(!m) return {url:pageUrl, w:0, h:0};
  const title='File:'+decodeURIComponent(m[1]);
  const key=title+'|'+width; if(commonsCache[key]) return commonsCache[key];
  const api=`https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=${width}&format=json&origin=*`;
  try{ const r=await fetch(api); const j=await r.json(); const p=Object.values(j.query.pages)[0]; const ii=p.imageinfo&&p.imageinfo[0];
    if(!ii) return {url:pageUrl, w:0, h:0};
    const audio=!!(ii.mime&&ii.mime.startsWith('audio'));
    const upscaled = !!(ii.thumbwidth && ii.width && ii.thumbwidth > ii.width);   // the file is smaller than we asked for
    const info = audio ? {url:ii.url, w:0, h:0, natw:0, nath:0}
                       : { url: (upscaled || !ii.thumburl) ? ii.url : ii.thumburl,
                           w: upscaled ? ii.width  : (ii.thumbwidth  || ii.width  || 0),
                           h: upscaled ? ii.height : (ii.thumbheight || ii.height || 0),
                           natw: ii.width||0, nath: ii.height||0 };
    commonsCache[key]=info; return info; }catch(e){ return {url:pageUrl, w:0, h:0}; }
}
async function commonsUrl(pageUrl, width=1600){ return (await commonsInfo(pageUrl,width)).url; }   // every old caller still works
const isCommons=u=>/commons\.wikimedia\.org\/wiki\/File:/.test(u);

function loadYT(){ return new Promise(res=>{ if(window.YT&&YT.Player) return res(); const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); window.onYouTubeIframeAPIReady=()=>res(); }); }

function speak(text, onBoundary, onEnd){

// ---------- v0.8: stills on the scene clock ---------------------------------------------------------------------
// A photo scene used to cycle its pictures on a wall-clock setInterval that divided duration_s evenly and ignored
// the authored start_s/end_s. Three things were wrong with that: the pictures did not land where they were written
// to land; the interval never re-synced after a pause, a jump or a mid-scene restore; and it kept changing pictures
// while the day was stopped, which contradicts "one coherent pause" (v0.6). imageSlots() turns media[] into
// schedule items on the SAME scene clock every other scene type uses.
//   · authored  — any entry carrying start_s/end_s: each picture starts at its own second (a missing start_s
//                 inherits the previous entry's end_s). Several entries authored over the SAME window share it
//                 evenly, which is how a scene says "these two pictures, over this stretch".
//   · fallback  — no entry carries any timing: the v0.7 even division, floor and wrap-around included, so nothing
//                 that was authored without timings changes at all.
// `until` (the first generated asset's start) bounds the list: pictures at or after it belong to the card, not to
// the cycle. end_s bounds a slot but never blanks the frame — the last picture holds rather than leaving black.
function imageSlots(imgs, duration, until){
  if(IL) return IL.imageSlots(imgs, duration, until);            // the ONE definition (shared with the renderer)
  const n=imgs.length; if(!n) return [];                          // degraded: v0.7 even division, no authored slots
  const step=Math.max(8, duration/n), lim=(until!=null&&isFinite(until))?until:duration, seq=[];
  for(let i=0; i===0 || i*step < Math.max(duration,step)-0.001; i++) seq.push({start:i*step, end:null, m:imgs[i%n]});
  return seq.filter(x=>x.start<lim-0.001);
}
// The items themselves: showImage() already re-checks sched.active after its Commons lookup, so a slow picture
// cannot clobber the slot that replaced it. Nothing here holds a timer — pause, seek, jump and restore are the
// scene clock's business, and the clock is stopped while the day is stopped.
function photoItems(imgs, duration, until){
  return imageSlots(imgs,duration,until).map(sl=>({ start:sl.start, m:sl.m, fn:()=>{ showImage(sl.m,true); } }));
}

// v0.7: an inset is still an inset, but it may not claim pixels it does not have: `max-width` is clamped to the

// carries its credit under it instead of only in `alt`.

  const wrap=document.createElement('figure'); wrap.className='imginsetwrap';

// ---------- v0.7: the image treatment layer -------------------------------------------------------------------
// One entry point (mountImage) for every still the player shows full-frame. It reads the picture's REAL pixels and
// the REAL frame and picks one of four treatments; `media[].treatment` in the scene overrides it.
// Config, not hard-coded: /config.json may carry an `images` object with any of these keys; ?drift=0 holds every
// still dead still (the screenshot test and, later, the renderer).
// v0.9: the arithmetic moved to studio/player/imagelayer.mjs and the LINEAR RENDERER imports the same file, so a
// picture is mounted the same way in this chapter and in the film. Loaded once at boot (before the first scene),
// exactly like panomove.mjs. If it cannot be fetched the player still runs: `backdrop` for everything and the
// v0.7 even division for photo scenes — degraded, obviously wrong-looking on small plates, never broken.
let IL=null;
const IMGCFG={ plate_max_px:760, plate_min_area:0.22, fill_coverage:0.90, blur_px:36,
               drift:true, drift_s:36, drift_from:0.94, drift_from_plate:0.97, fallback_after_s:6 };
async function loadImageLayer(){
  if(IL) return IL;
  // merge UNDER whatever is already there: /config.json is fetched on a floating promise and may have landed
  // first, and a config override must never be undone by a default.
  try{ IL=await import('./imagelayer.mjs'); for(const k in IL.IMG_DEFAULTS) if(!(k in IMGCFG)) IMGCFG[k]=IL.IMG_DEFAULTS[k]; }
  catch(e){ console.error('[yunyou] imagelayer.mjs did not load — stills degrade to plain backdrops', e); }
  if(qs.get('drift')==='0') IMGCFG.drift=false;
  return IL;
}
if(qs.get('drift')==='0') IMGCFG.drift=false;
const reduceMotion=()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
const hash32=s=>IL?IL.hash32(s):(()=>{ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; })();

// Which treatment? Aspect ratio and pixel size decide, so existing scenes improve with no content edit.
function pickTreatment(m, nw, nh, W, H){
  if(IL) return IL.pickTreatment(m, nw, nh, W, H, IMGCFG);
  const forced=String((m&&m.treatment)||'').toLowerCase();
  return (forced==='backdrop'||forced==='plate'||forced==='fill'||forced==='none') ? forced : 'backdrop';
}

let imgRO=null;   // one ResizeObserver at a time: the mounted still re-lays itself out when the frame changes
function mountImage(m, url, info, ser){
  const box=$('#media'); box.innerHTML='';
  if(imgRO){ try{ imgRO.disconnect(); }catch(e){} imgRO=null; }
  const att=m.attribution||'';
  const stage=document.createElement('div'); stage.className='imgstage'; stage.dataset.treatment='pending';
  const back=document.createElement('img'); back.className='imgback'; back.alt=''; back.decoding='async'; back.setAttribute('aria-hidden','true');
  const veil=document.createElement('div'); veil.className='imgveil';
  const img=document.createElement('img'); img.className='imgmain'; img.decoding='async'; img.alt=att||(m.note||'');
  const plate=document.createElement('figure'); plate.className='imgplate';
  const cap=document.createElement('figcaption'); cap.className='imgcredit'; cap.textContent=att;
  const corner=document.createElement('div'); corner.className='imgcredit'; corner.textContent=att;
  let nw=(info&&info.w)||0, nh=(info&&info.h)||0, treat='backdrop';

  // the paper mount is sized to the picture's own pixels (never above them), inside the frame it has
  const sizePlate=(W,H)=>{
    const pad=Math.max(9, Math.round(Math.min(W,H)*0.028));
    plate.style.setProperty('--yy-pad', pad+'px');
    const margin=Math.max(7, Math.round(Math.min(W,H)*0.036));
    const fit=capH=>{ const availW=Math.max(40, W-2*margin-2*pad-2), availH=Math.max(40, H-2*margin-2*pad-2-capH);
      const k=Math.min(1, availW/nw, availH/nh);                 // k is capped at 1: the plate is never upscaled
      img.style.width=Math.round(nw*k)+'px'; img.style.height=Math.round(nh*k)+'px';
      cap.style.width=Math.round(nw*k)+'px'; return Math.round(nw*k); };
    fit(att?28:0);                                               // first pass: guess the caption height…
    if(att) fit(Math.min(H*0.3, cap.getBoundingClientRect().height+8));   // …then measure it and settle
  };

  const layout=()=>{
    if(!stage.isConnected){ if(imgRO){ try{ imgRO.disconnect(); }catch(e){} imgRO=null; } return; }
    const W=box.clientWidth||0, H=box.clientHeight||0;
    treat=pickTreatment(m,nw,nh,W,H);
    stage.dataset.treatment=treat; stage.dataset.nw=String(nw); stage.dataset.nh=String(nh);
    const wantBack=(treat==='backdrop'||treat==='plate');
    if(wantBack){ if(!back.parentNode) stage.insertBefore(back, stage.firstChild);
                  if(!back.src) back.src=url;                    // same URL as the picture: already cached, no second fetch
                  if(!veil.parentNode) stage.insertBefore(veil, back.nextSibling);
                  // …so the radius set here is a TENTH of the on-screen radius (the layer is scaled 12.5x, with 25% overscale)
                  stage.style.setProperty('--yy-blur', (Math.max(14, IMGCFG.blur_px*Math.min(W,H)/620)/12.5).toFixed(2)+'px'); }
    else { back.remove(); veil.remove(); }
    const place=t=>{ if(t==='plate'){
        if(img.parentNode!==plate) plate.appendChild(img);
        if(att && cap.parentNode!==plate) plate.appendChild(cap);
        if(plate.parentNode!==stage) stage.appendChild(plate);
        corner.remove(); sizePlate(W,H);
      } else {
        plate.remove(); cap.remove();
        img.style.width=''; img.style.height=''; img.style.maxHeight=''; img.style.marginBottom='';
        if(img.parentNode!==stage) stage.appendChild(img);
        if(att && corner.parentNode!==stage) stage.appendChild(corner);
        // The credit is part of the LAYOUT, not something dropped on top of the picture. A 100-character CC BY-SA
        // line is four lines on a 280-px Fold cover, and it was landing across Passepartout's legs. The band is
        // reserved at the bottom of the frame (it sits on the ambient backdrop) and the picture is centred in what
        // is left — smaller, but whole, and the credit is never read against the subject.
        if(att){ const ch=corner.offsetHeight||0;
          if(ch>0 && H>ch+80){ img.style.maxHeight=(H-ch-12)+'px'; img.style.marginBottom=(ch+12)+'px'; } }
      } };
    place(treat);
    // A paper mount costs a margin, two paper edges and a caption line. On a Fold cover (#media is ~280×222) that
    // leaves a 474×700 plate at 14 % of the frame — the mount is then taking more than it gives, and the ambient
    // backdrop shows far more picture. Measured, not guessed, and never overrides an explicit `treatment`.
    if(treat==='plate' && !(m&&m.treatment) && (img.offsetWidth*img.offsetHeight)/(W*H) < IMGCFG.plate_min_area){
      treat='backdrop'; stage.dataset.treatment='backdrop'; place('backdrop');
    }
    // gentle motion, on whichever box is the picture now. Subtle by the tone spec (positioning.md, "The chill").
    const target=(treat==='plate')?plate:img, other=(treat==='plate')?img:plate;
    other.classList.remove('drift'); other.style.removeProperty('transform');
    target.classList.remove('drift');
    // media[].drift:false lets one beat sit still without opting out of the treatment layer. Before this, the only
    // way to stop the motion was treatment:'none', which also killed the backdrop and gave black bars.
    if(IMGCFG.drift && m.drift!==false && !reduceMotion() && treat!=='none'){
      const h=hash32(String(m.ref||url));                        // stable per picture: the same still drifts the same way every time
      target.style.setProperty('--kb-from', String(treat==='plate'?IMGCFG.drift_from_plate:IMGCFG.drift_from));

  // slot has passed is as absent as one that 404s. So the fallback is tried on error AND on a watchdog

    fbTimer=setTimeout(()=>{ if(ser!==sceneSerial||!stage.isConnected) return; if(!(img.complete&&img.naturalWidth)) useFallback('too slow'); }, +IMGCFG.fallback_after_s*1000);

  try{ imgRO=new ResizeObserver(()=>layout()); imgRO.observe(box); }catch(e){}
  return stage;
}

// ================= Street View v0.4 — cinematic auto-walk =================
// The scene walks itself: the camera glides along interaction.route (or the streetview media stops), paced to
// duration_s, and turns to look at whatever the `camera` track names, at the same at_s as the pin that names it.
// Three modes, chosen silently in this order (fallback ladder):
//   js     Maps JavaScript API StreetViewPanorama — real panos, pano-to-pano walking via links, eased POV (best)
//   stills Street View Static API — a hyperlapse of frames along the same timeline, cross-faded (no JS API needed)
//   link   no key / nothing enabled — an auto-advancing stop card with "open in Google Maps"
// Rights: nothing here is recorded, persisted or pre-bundled. Static frames are requested at playback time with a
// <=2-frame lookahead and live only in the browser's image cache. Google's attribution (logo + ©-line, baked into
// both the pano and the static image) is never covered: our chrome sits top-left/top-right and the cross-fade
// stops 30 px above the bottom edge.

// ---- plan: stops with arrival times + normalised camera cues -------------------------------------------------
function svPlan(s){

  const route=(((s.interaction||{}).route)||[]).map(svParse).filter(Boolean);
  let stops = route.length ? route : mediaStops.map(x=>x.p);
  if(!stops.length) return null;
  if(route.length) stops.forEach(st=>{ const near=mediaStops.find(x=>svDist(x.p,st)<25); if(near){ if(st.heading==null) st.heading=near.p.heading; if(!st.fov) st.fov=near.p.fov; st.fallback=near.m.fallback; st.attribution=near.m.attribution; st.note=near.m.note; } });
  else stops.forEach((st,i)=>{ st.fallback=mediaStops[i].m.fallback; st.attribution=mediaStops[i].m.attribution; st.note=mediaStops[i].m.note; });

      ease_s:isFinite(c.ease_s)?+c.ease_s:1.8, label:c.label||'' }))
    .filter(c=>c.heading!=null||c.look_at).sort((a,b)=>a.at_s-b.at_s);

function svCameraAt(pl, t){
  let k=0; for(let i=0;i<pl.stops.length;i++) if(t>=pl.stops[i].arrive_s) k=i;
  const cur=pl.stops[k], nxt=pl.stops[k+1];
  let cue=null; for(const c of pl.cues){ if(c.at_s<=t) cue=c; else break; }
  const cueLive = !!(cue && t < cue.at_s + Math.max(cue.hold_s, cue.ease_s));
  const holding = !!(cue && t < cue.at_s + cue.hold_s);
  let pos=cur, moving=false;
  if(nxt){
    const holdEnd=pl.cues.reduce((a,c)=> (c.at_s>=cur.arrive_s-0.01 && c.at_s<nxt.arrive_s) ? Math.max(a,c.at_s+c.hold_s) : a, cur.arrive_s);
    const t0=Math.min(holdEnd, nxt.arrive_s-1), t1=nxt.arrive_s;
    const f=Math.max(0,Math.min(1,(t-t0)/Math.max(0.5,t1-t0)));
    pos=svLerpPos(cur,nxt,f); moving=f>0&&f<1;
  }
  const travel = nxt ? svBearing(pos,nxt) : (cur.heading!=null?cur.heading:0);
  let heading=travel, pitch=0, zoom=SVCFG.base_zoom;
  if(cueLive){ heading = cue.look_at ? svBearing(pos,cue.look_at) : cue.heading; pitch=cue.pitch; if(cue.zoom!=null) zoom=cue.zoom; }
  else if(!nxt && cur.heading!=null){ heading=cur.heading; if(cur.fov) zoom=svFovToZoom(cur.fov); }
  return {pos, heading:svNorm(heading), pitch, zoom, holding, moving, stop:k, cue:cueLive?cue:null};
}

// ---- chrome: controls top-left, our attribution top-right, cross-fade that spares Google's ©-line -------------
function svChrome(box, plan, ctl){
  const bar=document.createElement('div'); bar.className='svbar';
  const bP=document.createElement('button'); bP.className='btn svbtn'; bP.id='svPause'; bP.textContent='⏸'; bP.title='pause';
  bP.setAttribute('aria-label','pause the walk');
  bP.onclick=()=>{ togglePause(); };                       // v0.6: the same master pause as the footer and the spacebar
  bP.textContent=hardPaused()?'▶':'⏸';
  const bR=document.createElement('button'); bR.className='btn svbtn'; bR.id='svReplay'; bR.textContent='↻'; bR.title='replay the walk';
  bR.setAttribute('aria-label','replay the walk'); bR.onclick=()=>showScene(idx);
  bar.append(bP,bR);
  const att=document.createElement('div'); att.className='svattr'; att.id='svAttr'; att.textContent='Google Street View';
  const fade=document.createElement('div'); fade.className='svfade';
  box.append(bar,att,fade);
  return { fade, att, bar,
    flash:()=>{ fade.style.opacity='0.62'; setTimeout(()=>{ fade.style.transition='opacity '+SVCFG.fade_ms+'ms ease-out'; fade.style.opacity='0';
        setTimeout(()=>fade.style.transition='opacity .18s linear', SVCFG.fade_ms); }, 120); } };
}
// user drag pauses the auto-walk; it resumes ~4 s after the last touch. No click is ever required.
function svWireIdle(el, ctl){
  const touch=()=>{ ctl.userUntil=elapsed+SVCFG.resume_after_s; ctl.userActive=true; };
  const rest=()=>{ ctl.userActive=false; ctl.userUntil=elapsed+SVCFG.resume_after_s; };
  el.addEventListener('pointerdown',touch); el.addEventListener('pointermove',e=>{ if(e.buttons) touch(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,rest));
  el.addEventListener('wheel',()=>{ touch(); rest(); },{passive:true});
}

// ---- mode js: Maps JavaScript API ----------------------------------------------------------------------------
function svLoadMapsJs(key){
  // RULE 1 HARD STOP: the Maps JavaScript API is a BILLABLE SKU (dynamic panorama loads). Never load the script —
  // not even to probe — unless the server config explicitly acknowledges billing. Loading it authenticates the key,
  // which is exactly the kind of silent, unasked-for spend the founder's rule forbids.
  if(!(SVCFG && SVCFG.billing_ack===true)) return Promise.reject(new Error('billable-mode-refused'));
  if(window.google&&window.google.maps&&google.maps.StreetViewPanorama) return Promise.resolve('ready');
  if(!key) return Promise.reject(new Error('no-key'));
  if(svAuthFailed) return Promise.reject(new Error('auth-failed'));
  if(svJsPromise) return svJsPromise;
  svJsPromise=new Promise((res,rej)=>{
    const to=setTimeout(()=>rej(new Error('timeout')),9000);
    const prev=window.gm_authFailure;
    window.gm_authFailure=()=>{ clearTimeout(to); svAuthFailed=true; prev&&prev(); rej(new Error('gm_authFailure')); };
    window.__svMapsReady=()=>{ clearTimeout(to); res('loaded'); };
    const sc=document.createElement('script'); sc.async=true;
    sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&v=weekly&loading=async&callback=__svMapsReady';
    sc.onerror=()=>{ clearTimeout(to); rej(new Error('script-error')); };
    document.head.appendChild(sc);
  }).catch(e=>{ svJsPromise=null; throw e; });
  return svJsPromise;
}
async function svLive(plan, box, ctl){
  await svLoadMapsJs(svKey());
  if(ctl.dead) return;
  const host=document.createElement('div'); host.className='svpano'; box.appendChild(host);
  const src=(google.maps.StreetViewSource&&(google.maps.StreetViewSource.GOOGLE||google.maps.StreetViewSource.OUTDOOR))||undefined; // Google-collected imagery: no third-party photosphere attribution
  const svc=new google.maps.StreetViewService();
  const first=await new Promise(res=>svc.getPanorama({location:plan.stops[0], radius:SVCFG.radius_m, source:src},(d,st)=>res(st==='OK'||st===google.maps.StreetViewStatus.OK?d:null)));
  if(ctl.dead) return;
  if(!first) throw new Error('no-pano');
  const c0=svCameraAt(plan,0);
  const pano=new google.maps.StreetViewPanorama(host,{ pano:first.location.pano, pov:{heading:c0.heading,pitch:c0.pitch}, zoom:c0.zoom,
    visible:true, disableDefaultUI:true, clickToGo:false, scrollwheel:false, linksControl:false, panControl:false, zoomControl:false,
    addressControl:false, fullscreenControl:false, imageDateControl:false, motionTracking:false, motionTrackingControl:false,
    enableCloseButton:false, showRoadLabels:false });
  ctl.pano=pano; ctl.mode='js';
  const chrome=svChrome(box,plan,ctl); svWireIdle(host,ctl);
  let cur={h:c0.heading,p:c0.pitch,z:c0.zoom}, vh={v:0}, vp={v:0}, vz={v:0}, last=performance.now()/1000;
  let pos=first.location.latLng?{lat:first.location.latLng.lat(),lng:first.location.latLng.lng()}:plan.stops[0];
  let links=first.links||[], nextStepAt=0, loads=1;
  pano.addListener('position_changed',()=>{ const p=pano.getPosition(); if(p){ pos={lat:p.lat(),lng:p.lng()}; } });
  pano.addListener('links_changed',()=>{ links=pano.getLinks()||[]; });
  pano.addListener('pano_changed',()=>{ chrome.flash(); });
  const jump=target=>svc.getPanorama({location:target, radius:40, source:src},(d,st)=>{ if(ctl.dead) return;
    if((st==='OK'||st===google.maps.StreetViewStatus.OK)&&d){ loads++; pano.setPano(d.location.pano); } });
  const step=target=>{                         // one pano along the street toward the target, using this pano's links
    const want=svBearing(pos,target); let best=null, bd=999;
    (links||[]).forEach(l=>{ const d=Math.abs(svDelta(l.heading,want)); if(d<bd){ bd=d; best=l; } });
    if(best&&bd<62){ loads++; pano.setPano(best.pano); return true; }
    jump(target); return false;                // no link down this street (turn, dead end): hop straight there
  };
  const frame=()=>{
    if(ctl.dead) return; ctl.raf=requestAnimationFrame(frame);
    const now=performance.now()/1000, dt=Math.min(0.1,Math.max(0.001,now-last)); last=now;
    if(paused||document.hidden) return;
    const t=elapsed, tgt=svCameraAt(plan,t);
    ctl.debug={mode:'js', t, stop:tgt.stop, cue:tgt.cue?tgt.cue.label:'', loads, heading:cur.h, holding:tgt.holding, gap:Math.round(svDist(pos,tgt.pos)), pos};
    if(ctl.userActive||t<ctl.userUntil){ const pv=pano.getPov(); if(pv){ cur.h=pv.heading; cur.p=pv.pitch; } vh.v=vp.v=0; return; } // hands off while the traveller looks around
    const smooth = tgt.cue ? Math.max(0.35,(tgt.cue.ease_s||1.8)/2) : SVCFG.smooth_s;
    const want = (tgt.cue&&tgt.cue.look_at) ? svBearing(pos,tgt.cue.look_at) : tgt.heading;   // aim from where we really are
    cur.h = svNorm(svSmooth(cur.h, cur.h+svDelta(cur.h,want), vh, smooth, dt));
    cur.p = svSmooth(cur.p, tgt.pitch, vp, smooth, dt);
    cur.z = svSmooth(cur.z, tgt.zoom, vz, smooth*1.4, dt);
    pano.setPov({heading:cur.h, pitch:cur.p}); if(Math.abs((pano.getZoom()||1)-cur.z)>0.02) pano.setZoom(cur.z);
    const wall=now, gap=svDist(pos,tgt.pos);                       // rate-limit on the wall clock: a seek must not freeze the walk
    if(wall>=nextStepAt && gap>SVCFG.step_m){
      if(tgt.holding||gap>120){ nextStepAt=wall+0.9; jump(tgt.pos); }   // late for a look-at, or a long hop: go straight to the stop
      else { nextStepAt=wall+0.55; step(tgt.pos); }
    }
  };
  ctl.raf=requestAnimationFrame(frame);
  return 'js';
}

// ---- mode stills: Street View Static API hyperlapse ------------------------------------------------------------
async function svProbeStatic(key, at){
  const base='https://maps.googleapis.com/maps/api/streetview/metadata?location='+at.lat.toFixed(6)+','+at.lng.toFixed(6)+'&radius=60&key='+encodeURIComponent(key);
  for(const pol of ['', 'no-referrer']){                       // metadata answers 200 even when denied: probing costs nothing and logs nothing
    try{ const r=await fetch(base, pol?{referrerPolicy:pol}:{}); const j=await r.json();
      if(j.status==='OK'||j.status==='ZERO_RESULTS') return {ok:true, pol, date:j.date||''};
    }catch(e){ /* offline */ }
  }
  return {ok:false};
}
function svStillsAllowed(){ return SVCFG && SVCFG.billing_ack===true; }   // RULE 1: Street View Static bills per image
function svStillFrames(plan){
  const out=[]; let last=null;
  for(let t=0;t<=plan.dur;t+=0.5){
    const c=svCameraAt(plan,t); const lab=c.cue?c.cue.label:'';
    const far = !last || svDist(last.pos,c.pos)>=SVCFG.step_m;
    const turn = !last || Math.abs(svDelta(last.heading,c.heading))>=16 || lab!==last.lab;
    if(far||turn){ out.push({t, pos:c.pos, heading:c.heading, pitch:c.pitch, zoom:c.zoom, lab, keep:(lab!==(last?last.lab:null))}); last=out[out.length-1]; }
  }
  if(!out.length) out.push({t:0, ...svCameraAt(plan,0), lab:'', keep:true});
  if(out.length>SVCFG.max_stills){                              // thin the plain travel frames, keep every look-at
    const keep=out.filter(f=>f.keep), rest=out.filter(f=>!f.keep);
    const room=Math.max(1,SVCFG.max_stills-keep.length), stride=Math.ceil(rest.length/room);
    out.length=0; out.push(...keep, ...rest.filter((_,i)=>i%stride===0)); out.sort((a,b)=>a.t-b.t);
  }
  return out;
}
function svStillUrl(f, w, h, key){
  return 'https://maps.googleapis.com/maps/api/streetview?size='+w+'x'+h
    +'&location='+f.pos.lat.toFixed(6)+','+f.pos.lng.toFixed(6)
    +'&heading='+svNorm(f.heading).toFixed(1)+'&pitch='+(f.pitch||0).toFixed(1)
    +'&fov='+svZoomToFov(f.zoom).toFixed(0)+'&source=outdoor&key='+encodeURIComponent(key);
}
async function svStills(plan, box, ctl){
  const key=svKey(); if(!key) throw new Error('no-key');
  const probe=await svProbeStatic(key, plan.stops[0]); if(ctl.dead) return;
  if(!probe.ok) throw new Error('static-denied');
  if(!svStillsAllowed()) throw new Error('billable-mode-refused');   // RULE 1
  const frames=svStillFrames(plan); ctl.mode='stills';
  const r=box.getBoundingClientRect(); const w=640, h=Math.max(200,Math.min(640,Math.round(640*(r.height||540)/(r.width||960))));
  const layers=[document.createElement('img'),document.createElement('img')];
  layers.forEach(im=>{ im.className='svstill'; im.alt='Google Street View'; im.decoding='async'; if(probe.pol) im.referrerPolicy=probe.pol; box.appendChild(im); });
  const chrome=svChrome(box,plan,ctl);          // no drag-to-look in this mode: a still cannot be panned, so nothing to pause
  chrome.att.textContent='Google Street View — hyperlapse';
  let shown=-1, front=0, warm=[];
  const url=f=>svStillUrl(f,w,h,key);
  const preload=i=>{ for(let k=i;k<Math.min(frames.length,i+3);k++){ if(warm[k]) continue; const im=new Image(); if(probe.pol) im.referrerPolicy=probe.pol; im.src=url(frames[k]); warm[k]=im; } }; // <=2 frames ahead, browser cache only — never written to disk
  preload(0);
  const show=i=>{ const back=layers[1-front], f=frames[i];
    back.onload=()=>{ back.classList.add('on'); layers[front].classList.remove('on'); front=1-front; };
    if(probe.pol) back.referrerPolicy=probe.pol; back.src=url(f); shown=i; preload(i+1); };
  const frame=()=>{ if(ctl.dead) return; ctl.raf=requestAnimationFrame(frame);
    if(paused||document.hidden) return;
    const t=elapsed; if(ctl.userActive||t<ctl.userUntil){ ctl.debug={mode:'stills',t,frame:shown,held:true}; return; }
    let i=0; for(let k=0;k<frames.length;k++) if(t>=frames[k].t) i=k;
    ctl.debug={mode:'stills', t, frame:i, frames:frames.length, cue:frames[i].lab};
    if(i!==shown) show(i); };
  show(0); ctl.raf=requestAnimationFrame(frame);
  return 'stills';
}

function svStop(){ if(svRun){ svRun.dead=true; if(svRun.raf) cancelAnimationFrame(svRun.raf); try{ svRun.pano&&svRun.pano.setVisible(false); }catch(e){} svRun=null; } }

// ---- mode: embed — Maps Embed API. FREE and unlimited (founder RULE 1). Not programmable like the JS API, but the
// URL carries location/heading/pitch/fov, so we can still move the camera along the route on the narration timeline
// by swapping the src at each stop and each look-at cue. Two stacked iframes cross-fade so the reload does not flash.
function svEmbedUrl(key, lat, lng, heading, pitch, fov){
  return 'https://www.google.com/maps/embed/v1/streetview?key='+encodeURIComponent(key)
    +'&location='+lat+','+lng+'&heading='+(heading||0)+'&pitch='+(pitch||0)+'&fov='+(fov||90);
}
async function svEmbed(plan, box, ctl){
  const key=LS.get('yy-gkey');
  if(!key) throw new Error('no maps key');
  // one timeline entry per stop arrival and per camera cue, in time order
  const marks=[];
  plan.stops.forEach((st,i)=>marks.push({t:st.arrive_s||0, lat:st.lat, lng:st.lng, heading:st.heading||0, pitch:st.pitch||0, fov:st.fov||90, lab:'stop '+(i+1)}));
  (plan.cues||[]).forEach(c=>{
    let ref=plan.stops[0], best=1e9;
    plan.stops.forEach(st=>{ const d=Math.abs((st.arrive_s||0)-c.at_s); if((st.arrive_s||0)<=c.at_s && d<best){ best=d; ref=st; } });
    let h=c.heading; if(h==null && c.look_at) h=svBearing(ref,c.look_at);
    if(h!=null) marks.push({t:c.at_s, lat:ref.lat, lng:ref.lng, heading:h, pitch:c.pitch||0, fov:ref.fov||90, lab:c.label||'look'});
  });
  marks.sort((a,b)=>a.t-b.t);
  const wrap=document.createElement('div'); wrap.className='fill'; wrap.style.cssText='inset:0;padding:0';
  const mk=()=>{ const f=document.createElement('iframe'); f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity '+(SVCFG.fade_ms||380)+'ms ease'; f.allow='accelerometer; gyroscope'; f.referrerPolicy='no-referrer-when-downgrade'; f.loading='eager'; return f; };
  const a=mk(), b=mk(); wrap.appendChild(a); wrap.appendChild(b); box.appendChild(wrap);
  let front=a, back=b, shown=-1;
  const go=(i)=>{ const m=marks[i]; back.src=svEmbedUrl(key,m.lat,m.lng,m.heading,m.pitch,m.fov);
    back.onload=()=>{ if(ctl.dead) return; back.style.opacity='1'; front.style.opacity='0'; const s=front; front=back; back=s; };
    shown=i; ctl.debug={mode:'embed', t:elapsed, mark:i, of:marks.length, cue:m.lab}; };
  go(0);
  ctl.mode='embed';
  const tick=()=>{ if(ctl.dead) return; ctl.raf=requestAnimationFrame(tick);
    if(paused||document.hidden) return;                               // v0.6: the embed's own timeline stops with the day
    if(ctl.userActive||elapsed<ctl.userUntil) return;                 // traveller is looking around inside the iframe
    let want=shown; for(let i=0;i<marks.length;i++) if(elapsed>=marks[i].t) want=i;
    if(want!==shown) go(want); };
  ctl.raf=requestAnimationFrame(tick);
  const note=document.createElement('div'); note.className='muted';
  note.style.cssText='position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;font-size:11px';
  note.textContent='Street View moves with the narration — drag inside to look around';
  wrap.appendChild(note);
  return 'embed';
}
// ---- mode open: OUR OWN cached open imagery (KartaView / Mapillary) ------------------------------------------
// Free, and the only mode whose pixels we may also put in the rendered video. Frames come from
// <chapter>/media/files/panos/, built by `node studio/tools/panowalk/fetch.mjs` (gitignored, regenerable).
// The move — cross-fade between frames, a slow drift inside each one, a turn onto the `camera` cues — is defined
// once in player/panomove.mjs and reused verbatim by the linear renderer, so the walk is the same in both outputs.
// Stops with no usable open imagery fall back to a Maps Embed (free) or, with no key, to the stop card: we never
// invent a walk where there is no imagery, and never claim a landmark the frames cannot show.
let panoIdxP=null, panoMoveP=null;
const panoBase=()=>TOUR_DIR+'media/files/panos/';
function panoIndex(){ if(!panoIdxP) panoIdxP=fetch(panoBase()+'index.json').then(r=>r.ok?r.json():null).catch(()=>null); return panoIdxP; }
function panoMove(){ if(!panoMoveP) panoMoveP=import('./panomove.mjs'); return panoMoveP; }
window.__panoReset=()=>{ panoIdxP=null; };   // test hook

async function svOpen(plan, box, ctl, scene){
  const [idx, PM] = await Promise.all([panoIndex(), panoMove()]);
  if(!idx||!Array.isArray(idx.stops)||!idx.stops.length) throw new Error('no-open-imagery');
  const mine=idx.stops.filter(x=>x.scene_id===scene.id);
  if(!mine.length) throw new Error('no-open-imagery-for-this-scene');
  const packs={};
  await Promise.all(mine.map(async st=>{ try{ const r=await fetch(panoBase()+st.stop_id+'/frames.json'); if(r.ok){ const j=await r.json(); if(j&&j.frames&&j.frames.length) packs[st.waypoint_index]=j; } }catch(e){} }));
  if(!Object.keys(packs).length) throw new Error('no-frames-cached');
  if(ctl.dead) return;

  const legs=plan.stops.map((st,k)=>{
    const t0=st.arrive_s||0, t1=(plan.stops[k+1]? plan.stops[k+1].arrive_s : plan.dur);
    const pack=packs[k];
    return pack ? {k,t0,t1,src:'open',pack,seg:PM.planStop(pack,t0,t1).segments} : {k,t0,t1,src:'gap',stop:st};
  });
  ctl.mode='open';
  ctl.coverage={ open:legs.filter(l=>l.src==='open').map(l=>l.k), gap:legs.filter(l=>l.src==='gap').map(l=>l.k) };

  box.innerHTML='';
  const layers=[document.createElement('div'),document.createElement('div')];
  layers.forEach(l=>{ l.className='svopen'; box.appendChild(l); });
  const gapBox=document.createElement('div'); gapBox.className='svgap'; box.appendChild(gapBox);
  const chrome=svChrome(box,plan,ctl); chrome.att.textContent='open street-level imagery';
  const credit=document.createElement('div'); credit.className='svcredit'; box.appendChild(credit);

  // drag to look around; the walk pauses while a hand is on it and eases back afterwards (v0.4 contract)
  svWireIdle(box,ctl); ctl.userYaw=0;
  let dragX=null, lastFov=82;
  box.addEventListener('pointerdown',e=>{ dragX=e.clientX; });
  box.addEventListener('pointermove',e=>{ if(dragX==null||!e.buttons) return;
    const w=box.getBoundingClientRect().width||960; ctl.userYaw-=(e.clientX-dragX)/w*lastFov; dragX=e.clientX; });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>box.addEventListener(t,()=>{ dragX=null; }));

  let front=0, shownKey='', gapFrame=null, lastLeg=-1;
  const url=(pack,f)=>panoBase()+pack.stop_id+'/'+(f.web||f.file);
  const place=(el,pack,f,win)=>{
    const r=box.getBoundingClientRect(), BW=r.width||960, BH=r.height||540;
    const bgW=BW/Math.max(0.001,win.w), bgH=BH/Math.max(0.001,win.h);
    el.style.backgroundRepeat=f.is_pano?'repeat-x':'no-repeat';
    el.style.backgroundSize=bgW.toFixed(1)+'px '+bgH.toFixed(1)+'px';
    el.style.backgroundPosition=(-win.x*bgW).toFixed(1)+'px '+(-win.y*bgH).toFixed(1)+'px';
  };
  const warm=new Set();
  const preload=(pack,f)=>{ const u=url(pack,f); if(warm.has(u)) return; warm.add(u); const im=new Image(); im.decoding='async'; im.src=u; };
  const showCredit=(pack,f)=>{
    credit.innerHTML='<a href="'+(f.source_url||'#')+'" target="_blank" rel="noopener">'+
      (pack.source==='mapillary'?'Mapillary':'KartaView')+'</a> · '+
      (pack.author||'contributor')+' · '+(pack.licence||'CC BY-SA 4.0')+' · '+(f.timestamp||'').slice(0,10);
    credit.style.display='block';
  };

}

async function showStreetView(s){
  svStop();
  const box=$('#media'); const plan=svPlan(s);
  if(!plan){ sceneCard(s,[]); return; }
  const ctl={dead:false, raf:0, userActive:false, userUntil:0, mode:null, plan, debug:{}}; svRun=ctl; window.__sv=ctl; // test/QA hook: mode, plan, live debug
  const ser=sceneSerial;
  box.innerHTML='<div class="fill"><div class="muted">Street View — connecting…</div></div>';
  ctl.onAuthFail=()=>{ if(ctl.dead||ctl.mode!=='js') return; ctl.mode=null; box.innerHTML=''; svBegin('stills'); };
  const want=(LS.get('yy-sv-mode')||SVCFG.mode||'auto').toLowerCase();
  // FREE-FIRST ladder (RULE 1): open (our own cached CC BY-SA frames — costs nothing, and the same pixels go in the
  // video) → embed (Maps Embed API, free and unlimited) → the link card.
  // 'js'/'stills' hit billable SKUs and are only reachable when config.billing_ack === true (svModeAllowed gates it).
  // DESIGN 2026-08-19 (founder, after playtesting): auto-walking Street View is dominated by both alternatives —
  // it discards the agency that makes Street View worth having, and cannot match video for smoothness. Street View is
  // now used ONLY as a stop-and-look (the traveller aims their own gaze at something worth finding). That needs no
  // programmatic camera control, so the free Maps Embed API is both the right affordance AND free. Mode 'open'
  // (open-imagery walk) is retired from the player ladder; its frames/cache/panomove.mjs live on for the VIDEO,
  // where transport is correctly served by a hyperlapse. See studio/research/scene-types.md.
  const ladder = want==='js' ? ['js','stills','embed','link']
    : want==='stills' ? ['stills','embed','link']
    : want==='link' ? ['link']
    : ['embed','link'];                                        // 'auto', 'embed' and the retired 'open' all land here
  const svBegin=async(from)=>{
    const chain=ladder.slice(ladder.indexOf(from)<0?0:ladder.indexOf(from));
    for(const m of chain){
      if(ctl.dead||ser!==sceneSerial) return;
      try{
        box.innerHTML='';
        if(m==='js'){ await svLive(plan,box,ctl); }
        else if(m==='stills'){ await svStills(plan,box,ctl); }
        else if(m==='open'){ await svOpen(plan,box,ctl,s); }
        else if(m==='embed'){ await svEmbed(plan,box,ctl); }
        else { svLinkCard(plan,box,ctl); }
        if(ctl.dead) return;
        return;                                                   // mode is up
      }catch(e){ if(ctl.dead) return; console.info('street view: '+m+' unavailable ('+(e&&e.message)+') — falling back'); ctl.mode=null; if(ctl.raf) cancelAnimationFrame(ctl.raf); box.innerHTML=''; }
    }
    ctl.mode='none'; sceneCard(s,[]);
  };
  await svBegin(ladder[0]);
}

function speechSplit(script, seconds, rate){
  script=script||''; if(!(seconds>0)||!script) return {said:'', rest:script};
  const cjk=(script.match(/[\u3400-\u9fff\u3040-\u30ff]/g)||[]).length;
  const est = cjk > script.length*0.3 ? cjk/(4.2*(rate||1)) : (script.split(/\s+/).filter(Boolean).length)/(2.6*(rate||1));
  if(seconds>=est*0.97) return {said:script, rest:''};
  const ci=Math.floor(script.length*Math.min(1,seconds/est));
  let cut=-1; ['. ','! ','? ','。','！','？','\n'].forEach(mk=>{ const k=script.lastIndexOf(mk,ci); if(k>cut) cut=k+mk.length; });
  return cut>0 ? {said:script.slice(0,cut), rest:script.slice(cut)} : {said:'', rest:script};
}
function tick(){ const s=scenes[idx]; if(!s) return; if(paused) t0=performance.now()-elapsed*1000; else elapsed=(performance.now()-t0)/1000; $('#prog i').style.width=Math.min(100,elapsed/s.duration_s*100)+'%'; $('#clock').textContent=`${paused?'⏸ ':''}${Math.floor(elapsed)}s / ${s.duration_s}s`; if(paused) return; saveProgress(); renderOverlays(s,elapsed); schedTick();
  const needsInput = s.interaction && s.interaction.kind!=='none' && !(s.interaction.kind==='walk'&&s.type==='streetview'); // v0.4: the auto-walk needs no input, so a streetview scene plays out and hands on like a video
  if(s.type==='game' && elapsed>=s.duration_s && gameApi && !gameApi.done) gameApi.close();
  if(elapsed>=s.duration_s && !needsInput && !speechSynthesis.speaking){ next(); } }
function pauseTimer(){ pauseFor('wait'); }
function resumeTimer(){ resumeFrom('wait'); } // interaction resolved: the scene clock (media schedule, overlays) runs on; auto-advance stays off for scenes that need input
function seek(sec){ elapsed=Math.max(0,sec); t0=performance.now()-elapsed*1000; pauseReasons.clear(); applyPause(); tick(); } // test/render hook: jump the scene clock (media schedule + overlays follow)
function next(){ const g=$('#interaction').dataset.goto; const j= g ? scenes.findIndex(x=>x.id===g) : -1; if(j>=0) return showScene(j); const nx=scenes[idx].next; const k= nx? scenes.findIndex(x=>x.id===nx) : -1; showScene(k>=0?k:idx+1); }
$('#next').onclick=next; $('#prev').onclick=()=>showScene(idx-1);
$('#btnCap').onclick=()=>{ captions=!captions; $('#btnCap').style.opacity=captions?1:.4; showScene(idx,{at:elapsed}); };   // v0.6: toggling captions no longer rewinds the scene
$('#btnMute').onclick=()=>{ narrate=!narrate; $('#btnMute').textContent=narrate?'🔈':'🔇'; if(!narrate) speechSynthesis.cancel(); };
// ---------- the scene list (v0.6; replaces a prompt() nobody could use on a phone) ----------
// Titles come straight from `scenes[]`, which the locale overlay has already rewritten — the list is localised for
// free and nothing is translated twice. Opening it stops the day (a list is a place to stand still and look).
let listPrevFocus=null;
function buildList(){
  const body=$('#listBody'); body.innerHTML='';
  const total=scenes.reduce((a,s)=>a+(+s.duration_s||0),0);
  $('#listSub').textContent=`${scenes.length} scenes · about ${Math.round(total/60)} minutes · tap one to go there`;
  scenes.forEach((s,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='scn'; b.dataset.i=String(i); b.setAttribute('role','listitem');
    if(i===idx) b.setAttribute('aria-current','true');
    const n=document.createElement('span'); n.className='n'; n.textContent=(i+1)+'.';
    const t=document.createElement('span'); t.className='t';
    const ttl=document.createElement('b'); ttl.textContent=s.title||s.id;                      // localised title, verbatim
    const meta=document.createElement('small'); meta.textContent=`${s.type} · ${fmtDur(s.duration_s||0)}${i===idx?' · here now':''}`;
    t.append(ttl,meta); b.append(n,t);
    b.onclick=()=>{ closeList(true); showScene(i); };
    body.appendChild(b); });
}
function openList(){ if(!scenes.length) return; listPrevFocus=document.activeElement; buildList();
  $('#list').hidden=false; $('#btnList').setAttribute('aria-expanded','true'); pauseFor('sheet');
  const cur=$('#listBody .scn[aria-current="true"]')||$('#listBody .scn');
  if(cur){ cur.focus(); try{ cur.scrollIntoView({block:'center'}); }catch(e){} } }
function closeList(jumping){ if($('#list').hidden) return; $('#list').hidden=true; $('#btnList').setAttribute('aria-expanded','false');
  resumeFrom('sheet'); if(!jumping&&listPrevFocus){ try{ listPrevFocus.focus(); }catch(e){} } listPrevFocus=null; }
$('#btnList').onclick=()=>{ $('#list').hidden? openList() : closeList(); };
$('#listClose').onclick=()=>closeList();
$('#list').addEventListener('click',e=>{ if(e.target===$('#list')) closeList(); });     // tap the dim to dismiss
$('#list').addEventListener('keydown',e=>{
  const items=[...$('#listBody').querySelectorAll('.scn')], at=items.indexOf(document.activeElement);
  if(e.key==='Escape'){ e.preventDefault(); closeList(); }
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const d=e.key==='ArrowDown'?1:-1;
    const nx=items[Math.max(0,Math.min(items.length-1,(at<0?0:at+d)))]; nx&&nx.focus(); }
  else if(e.key==='Home'&&items.length){ e.preventDefault(); items[0].focus(); }
  else if(e.key==='End'&&items.length){ e.preventDefault(); items[items.length-1].focus(); }
  e.stopPropagation();                                                                   // arrows/space never leak to the scene keys
});
$('#btnPause').onclick=()=>togglePause();
$('#pauseGo').onclick=()=>togglePause();
$('#testVoice').onclick=()=>{ voiceName=$('#voice').value; LS.set('yy-voice',voiceName); speak('It is Wednesday, the second of October, eighteen seventy-two. We have a train to catch.'); };
$('#voice').onchange=()=>{ voiceName=$('#voice').value; LS.set('yy-voice',voiceName); };
$('#rate').value=String(ttsRate()); $('#rate').onchange=e=>LS.set('yy-rate',e.target.value);

$('#clearEn').onchange=e=>{ clearEnglish=e.target.checked; LS.set('yy-clear',clearEnglish?'1':'0'); if(!LS.get('yy-rate')) $('#rate').value=String(ttsRate()); }; // no explicit speed chosen → clear mode defaults the dial to 0.9
// Maps key: server config first (www/config.json, gitignored — never committed), then whatever the traveller pasted.
// Maps key: server config (www/config.json, gitignored) supplies it, so the traveller never needs to paste one.
// The input stays available as an override for self-hosted copies — hidden unless there is no server key or the traveller asks.
// COST GATE (founder RULE 1, 2026-08-19): billable Google modes ('js' = Dynamic panorama, 'stills' = Street View Static)
// are refused unless the server config explicitly sets billing_ack:true. A free tier is not permission.
function svModeAllowed(cfg){
  const m=(cfg&&cfg.streetview&&cfg.streetview.mode)||'open';
  const billable=(m==='js'||m==='stills');                     // v0.5: 'auto' starts at 'open' and calls nothing billable
  if(billable && !(cfg&&cfg.billing_ack===true)){
    console.warn('[yunyou] streetview mode "'+m+'" calls a billable Google API; refused (config.billing_ack is not true). Falling back to "open".');
    return 'open';                                             // free mode, not the dead link card
  }
  return m;
}
fetch('/config.json').then(r=>r.ok?r.json():null).then(c=>{
  const own=LS.get('yy-own-gkey')==='1';
  if(c&&c.maps_api_key){ if(!own) LS.set('yy-gkey',c.maps_api_key);
    if(!own){ $('#gkeyRow').style.display='none'; $('#gkeyOk').style.display='block'; } }
  if(c&&c.streetview&&typeof c.streetview==='object') Object.assign(SVCFG,c.streetview);
  if(c&&c.images&&typeof c.images==='object'){ Object.assign(IMGCFG,c.images); if(qs.get('drift')==='0') IMGCFG.drift=false; }   // v0.7 image treatment thresholds — see www/config.example.json
  SVCFG.billing_ack = (c && c.billing_ack===true);   // RULE 1: billable SKUs stay locked unless the config says so explicitly
  SVCFG.mode = svModeAllowed(c);                      // and the mode itself is gated the same way // mode/step_m/max_stills/fade_ms/resume_after_s — see www/config.example.json
}).catch(()=>{});
$('#gkeyEdit')?.addEventListener('click',e=>{ e.preventDefault(); LS.set('yy-own-gkey','1'); LS.del('yy-gkey'); $('#gkeyOk').style.display='none'; $('#gkeyRow').style.display='block'; $('#gkey').value=''; });
$('#gkey').value=LS.get('yy-gkey')||''; $('#gkey').onchange=e=>LS.set('yy-gkey',e.target.value.trim());

// ---------- who's who (cast card; product-level shared/whos-who.json — button hidden if the file is missing) ----------
let whoData=null;
const escHtml=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadWhosWho(){
  const ref=(tour&&tour.whos_who)||'../shared/whos-who.json'; const url=/^(https?:)?\//.test(ref)?ref:TOUR_DIR+ref;
  try{ const r=await fetch(url); if(!r.ok) throw new Error(r.status); const j=await r.json();
    if(j&&Array.isArray(j.entries)&&j.entries.length){ whoData=j; $('#btnWho').hidden=false; } }
  catch(e){ console.warn('no whos-who card:',e.message); }
}
function openWho(){ if(!whoData) return; pauseFor('sheet');    // v0.6: a real pause — the interaction countdown holds too (v0.3 bug)
  $('#whoTitle').textContent=whoData.title||"Who's who";
  $('#whoBody').innerHTML=whoData.entries.map(en=>`<p><b>${escHtml(en.name)}</b> — ${escHtml(en.who)}</p>`).join('');
  $('#who').hidden=false; $('#whoClose').focus(); }
function closeWho(){ $('#who').hidden=true; resumeFrom('sheet'); $('#btnWho').focus(); }
$('#btnWho').onclick=openWho; $('#whoClose').onclick=closeWho;
$('#who').addEventListener('click',e=>{ if(e.target===$('#who')) closeWho(); });

document.addEventListener('keydown',e=>{ if(!$('#who').hidden){ if(e.key==='Escape') closeWho(); return; } // modal open: keys stay in the card
  if(!$('#list').hidden) return;                                        // the sheet handles its own keys
  if($('#cover')) return;                                               // the cover is up: keys belong to its form
  const tag=(e.target&&e.target.tagName)||'';
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='ArrowLeft'){ showScene(idx-1); }
  else if(e.key===' '||e.key==='Spacebar'||e.key==='k'){
    if(tag==='BUTTON'&&e.key!=='k') return;                             // space belongs to the button under the finger
    e.preventDefault(); togglePause(); } });

// ---------- the traveller leaves (v0.6) ----------
// Going away is not a mistake to be recovered from silently: the day stops, and it is still stopped when they come
// back — an hour later or a week later — so nothing is missed and nothing shouts.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ saveProgress(true); if(started) pauseFor('away'); }
  else paintPause();                                                    // back: they see the paused state and decide
});
window.addEventListener('pagehide',()=>saveProgress(true));
window.addEventListener('blur',()=>{ setTimeout(()=>{                   // another window/app took the focus
  if(!started||document.hidden||hardPaused()) return;
  const ae=document.activeElement;
  if(ae&&ae.tagName==='IFRAME') return;                                 // focus went INTO the YouTube / Street View embed: they are still here
  if(document.hasFocus()) return;
  pauseFor('away'); },250); });

(async()=>{
  await loadImageLayer();      // the shared image-treatment module, before the first scene can mount a still
  // ---- i18n: a locale is an index-addressed OVERLAY applied to the tour in memory, so every render path below
  // stays monolingual and unaware. English remains canonical in scenes/*.scene.json; a partial locale is valid.
  // Format: studio/templates/i18n-locale.md. Select with ?lang=zh-Hans or the picker on the cover.
  function applyLocale(tour, loc){
    if(!loc || !loc.scenes) return;
    const ch=tour.chapters[0];
    if(loc.chapter){ ['title','hook','recap'].forEach(k=>{ if(loc.chapter[k]) ch[k]=loc.chapter[k]; }); }
    (ch.scenes||[]).forEach(s=>{
      const L=loc.scenes[s.id]; if(!L) return;
      if(L.title) s.title=L.title;
      if(L.learning_goal) s.learning_goal=L.learning_goal;
      if(L.after_script){ s.narration=s.narration||{}; s.narration.after_script=L.after_script;   // renderer reads narration.after_script
        s.narration.after_script_variants=Object.assign({},s.narration.after_script_variants,{clear:L.after_script}); }
      if(L.script){ s.narration=s.narration||{}; s.narration.script=L.script;
        s.narration.variants=Object.assign({}, s.narration.variants, {clear:L.script}); }   // both registers -> the locale
      (L.overlays||[]).forEach(o=>{ const tgt=(s.overlays||[])[o.i]; if(tgt && o.text) tgt.text=o.text; });
      if(L.interaction && s.interaction){
        if(L.interaction.prompt) s.interaction.prompt=L.interaction.prompt;
        if(L.interaction.answer) s.interaction.answer=L.interaction.answer;
        (L.interaction.options||[]).forEach(o=>{ const tgt=(s.interaction.options||[])[o.i]; if(!tgt) return;
          if(o.text) tgt.text=o.text; if(o.feedback) tgt.feedback=o.feedback; });
      }
    });
  }
  async function loadLocale(code){
    if(!code || code==='en') return null;
    const base=TOUR_URL.replace(/\/[^/]*$/,'');
    try{ const r=await fetch(base+'/i18n/'+code+'.json'); if(!r.ok) return null; return await r.json(); }
    catch(e){ console.info('locale '+code+' unavailable'); return null; }
  }
  try{ tour=await (await fetch(TOUR_URL)).json(); }catch(e){ $('#coverTitle').innerHTML='<h1>Yunyou</h1><p>Could not load '+TOUR_URL+'</p>'; return; }
  const wantLang=(qs.get('lang')||LS.get('yy-lang')||'en');
  const langSel=$('#lang'); if(langSel){ langSel.value=wantLang;
    langSel.onchange=e=>{ const v=e.target.value; LS.set('yy-lang',v);
      const u=new URL(location.href); if(v==='en') u.searchParams.delete('lang'); else u.searchParams.set('lang',v); location.href=u.toString(); }; }
  LOCALE=await loadLocale(wantLang);
  if(LOCALE){ applyLocale(tour, LOCALE); LS.set('yy-lang', wantLang); voiceName=null; loadVoices();
    document.documentElement.lang = LOCALE.locale || wantLang; }
  const ch=tour.chapters[0]; scenes=ch.scenes; $('#hTitle').textContent=tour.title;
  const recap= typeof ch.recap==='string'&&ch.recap ? `<p class="muted" style="max-width:560px"><span style="letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--accent)">Previously</span><br>${ch.recap}</p>` : '';
  $('#coverTitle').innerHTML=`<p class="muted" style="letter-spacing:.2em;text-transform:uppercase">${tour.title}</p><h1>${ch.title}</h1><p>${ch.hook}</p>${recap}<p class="muted">${scenes.length} scenes · about ${Math.round(scenes.reduce((a,s)=>a+s.duration_s,0)/60)} minutes · headphones recommended</p>`;
  loadWhosWho();
  // ---- start / continue (v0.6) ----
  const begin=(i,at)=>{ const sel=$('#voice'); if(sel&&sel.value){ voiceName=sel.value; LS.set('yy-voice',voiceName); }
    started=true; const cov=$('#cover'); if(cov) cov.remove(); paintPause(); showScene(i,{at:at||0}); };
  $('#start').onclick=()=>{ clearProgress(); begin(0,0); };
  const prog=loadProgress();
  if(prog){
    const j=scenes.findIndex(x=>x.id===prog.sceneId);
    if(j>=0){
      const btn=$('#continue'); btn.hidden=false;
      btn.textContent=`▶ Continue — scene ${j+1}: ${scenes[j].title}`;      // localised title: the overlay is already applied
      btn.onclick=()=>begin(j, prog.elapsed);
      const note=$('#continueNote'); note.hidden=false;
      note.textContent=`saved ${agoText(prog.savedAt)} · ${fmtDur(prog.elapsed)} into that scene`;
      $('#start').textContent='Start the day again from the beginning';
      $('#start').classList.remove('primary');
      window.__progress=prog;                                              // test/QA hook
    } else clearProgress();                                                // the tour changed under the save: drop it quietly
  }
})();
