<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yunyou · player</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink:#ece6da; --dim:#a9a193; --bg:#0d0c0e; --panel:#17161a; --line:#2b292f; --accent:#d9a441; --ok:#7bc47f; --bad:#e07a6a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.45 Georgia,'Times New Roman',serif; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif; font-size:13px; color:var(--dim); }
  header b { color:var(--ink); font-weight:600; }
  header .sp { flex:1; }
  header button, .btn { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#1a1408; border-color:var(--accent); font-weight:600; }
  #stage { flex:1; min-height:0; display:flex; flex-direction:column; }
  #media { position:relative; flex:1 1 55%; min-height:34vh; background:#000; overflow:hidden; }
  #media iframe, #media img, #media video, #media .fill { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #media img { object-fit:contain; background:#000; }
  #media img.kenburns { object-fit:cover; animation:kb 30s ease-in-out infinite alternate; }
  @keyframes kb { from { transform:scale(1) translate(0,0);} to { transform:scale(1.12) translate(-2%,-1.5%);} }
  #media .fill { display:flex; align-items:center; justify-content:center; padding:5vmin; text-align:center; }
  .card { background:linear-gradient(160deg,#f4ecd8,#e7dcc0); color:#2a2118; border-radius:14px; padding:6vmin 7vmin; max-width:820px; box-shadow:0 20px 60px rgba(0,0,0,.6); font-size:clamp(15px,2.4vmin,22px); text-align:left; }
  .card h2 { margin:0 0 .5em; font-weight:600; font-size:1.25em; letter-spacing:.02em; }
  .card small { color:#6b5a48; font-family:system-ui,sans-serif; }
  #overlays { min-height:2.4em; padding:6px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--line); background:var(--panel); font-family:system-ui,sans-serif; font-size:13px; }
  .pin { border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:2px 10px; }
  .cap { color:var(--ink); }
  .fact { color:var(--dim); font-style:italic; }
  #panel { flex:0 1 auto; max-height:46%; overflow:auto; padding:10px 14px 14px; }
  #title { font-family:system-ui,sans-serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
  #script { margin:0; font-size:clamp(15px,2.2vmin,19px); }
  #script .said { color:var(--ink); } #script .unsaid { color:var(--dim); }
  #interaction { margin-top:10px; font-family:system-ui,sans-serif; }
  .opt { display:block; width:100%; text-align:left; margin:6px 0; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--ink); font:inherit; cursor:pointer; }
  .opt.correct { border-color:var(--ok); } .opt.wrong { border-color:var(--bad); } .opt.picked { background:#221f26; }
  .fb { margin:6px 0 0; padding:8px 12px; border-left:3px solid var(--accent); color:var(--ink); }
  .chat { display:flex; flex-direction:column; gap:6px; }
  .chat .q { align-self:flex-end; background:#2a2730; padding:8px 12px; border-radius:12px 12px 2px 12px; max-width:85%; }
  .chat .a { align-self:flex-start; background:#1c2a1e; padding:8px 12px; border-radius:12px 12px 12px 2px; max-width:85%; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:6px 10px; background:var(--panel); color:var(--ink); cursor:pointer; font:inherit; font-size:14px; }
  footer { display:flex; gap:8px; align-items:center; padding:8px 12px; border-top:1px solid var(--line); font-family:system-ui,sans-serif; font-size:13px; }
  #prog { flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; } #prog i { display:block; height:100%; width:0; background:var(--accent); transition:width .5s linear; }
  #cover { position:fixed; inset:0; background:radial-gradient(ellipse at 50% 30%, #241d14, #0d0c0e 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6vmin; z-index:10; }
  #cover h1 { font-weight:500; font-size:clamp(28px,6vmin,54px); margin:0 0 .2em; } #cover p { color:var(--dim); max-width:560px; }
  #cover label { font-family:system-ui,sans-serif; font-size:12px; color:var(--dim); display:block; margin-top:22px; }
  #cover input { background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 8px; width:min(90vw,420px); font:13px system-ui; }
  #cover select { background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 8px; font:13px system-ui; }
  .leaflet-container { background:#e9e2d0; }
  .genwrap { position:absolute; inset:0; background:#efe6d3; display:flex; align-items:center; justify-content:center; }
  .genwrap svg.gen { width:100%; height:100%; display:block; touch-action:none; }
  .genwrap svg.gen:focus-visible { outline:2px solid #b03a2e; outline-offset:-2px; }
  .genwrap svg.gen :focus:not(:focus-visible) { outline:none; } /* pointer taps on tabindex'd svg parts (bag, rows) must not draw the browser focus ring */
  #countdown { color:var(--accent); font-family:system-ui,sans-serif; font-size:12px; }
  .row-hl { pointer-events:none; }
  .muted { color:var(--dim); font-family:system-ui,sans-serif; font-size:13px; }
  @media (min-aspect-ratio: 4/3) { #stage { flex-direction:row; } #media { flex:1 1 60%; min-height:0; } #right { flex:1 1 40%; display:flex; flex-direction:column; min-width:0; } #panel { max-height:none; flex:1; } }
</style>
</head>
<body>
<div id="cover">
  <div id="coverTitle"><h1>Yunyou 云游</h1><p>loading tour…</p></div>
  <button class="btn primary" id="start" style="font-size:18px;padding:12px 26px">▶ Start the day</button>
  <label>Narration voice <select id="voice"></select> <button class="btn" id="testVoice">test</button></label>
  <label>Google Maps API key (optional — enables live Street View; stored only in this browser)<br><input id="gkey" placeholder="AIza…"></label>
  <p class="muted" style="margin-top:18px">Dry-run player · YouTube embeds, Wikimedia Commons media, browser TTS. Generated cards/maps are rendered live from the scene text.</p>
</div>

<div id="app">
  <header><b id="hTitle">Yunyou</b><span id="hScene"></span><span class="sp"></span>
    <button id="btnCap" title="captions">CC</button><button id="btnMute" title="narration on/off">🔈</button><button id="btnList">☰</button></header>
  <div id="stage">
    <div id="media"></div>
    <div id="right">
      <div id="overlays"></div>
      <div id="panel"><p id="title"></p><p id="script"></p><div id="interaction"></div></div>
    </div>
  </div>
  <footer><button class="btn" id="prev">‹ Back</button><div id="prog"><i></i></div><span id="clock"></span><span id="countdown"></span><button class="btn primary" id="next">Next ›</button></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const TOUR_URL=qs.get('tour')||'/products/around-the-world-80-days/day-01-london/tour.json';
const $=s=>document.querySelector(s);
let tour, scenes=[], idx=0, timer=null, t0=0, elapsed=0, paused=false, captions=true, narrate=true, ytPlayer=null, ytReady=false, bed=null, map=null;
const commonsCache={};

// ---------- Commons: File: page URL → direct file URL ----------
async function commonsUrl(pageUrl, width=1600){
  const m=pageUrl.match(/File:(.+)$/); if(!m) return pageUrl; const title='File:'+decodeURIComponent(m[1]);
  const key=title+width; if(commonsCache[key]) return commonsCache[key];
  const api=`https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=imageinfo&iiprop=url|mime&iiurlwidth=${width}&format=json&origin=*`;
  try{ const r=await fetch(api); const j=await r.json(); const p=Object.values(j.query.pages)[0]; const ii=p.imageinfo&&p.imageinfo[0];
    const url= ii ? (ii.mime&&ii.mime.startsWith('audio') ? ii.url : (ii.thumburl||ii.url)) : pageUrl; commonsCache[key]=url; return url; }catch(e){ return pageUrl; }
}
const isCommons=u=>/commons\.wikimedia\.org\/wiki\/File:/.test(u);

// ---------- YouTube ----------
function loadYT(){ return new Promise(res=>{ if(window.YT&&YT.Player) return res(); const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); window.onYouTubeIframeAPIReady=()=>res(); }); }
async function showYouTube(m){
  await loadYT(); const host=document.createElement('div'); host.id='yt'; $('#media').appendChild(host);
  ytPlayer=new YT.Player('yt',{videoId:m.ref, playerVars:{start:m.start_s||0, end:m.end_s||undefined, autoplay:1, controls:1, rel:0, modestbranding:1, playsinline:1, iv_load_policy:3},
    events:{ onReady:e=>{ e.target.setVolume(35); e.target.playVideo(); }, onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED){ /* keep last frame */ } } }});
}

// ---------- TTS ----------
let voices=[]; function loadVoices(){ voices=speechSynthesis.getVoices(); const sel=$('#voice'); sel.innerHTML='';
  const pref=voices.filter(v=>/en-GB|en_GB/i.test(v.lang)).concat(voices.filter(v=>/^en/i.test(v.lang)&&!/GB/i.test(v.lang)));
  pref.forEach(v=>{ const o=document.createElement('option'); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o); });
  const saved=localStorage.getItem('yy-voice'); if(saved) sel.value=saved; }
speechSynthesis.onvoiceschanged=loadVoices; loadVoices();
function speak(text, onBoundary, onEnd){
  speechSynthesis.cancel(); if(!narrate||!text){ onEnd&&setTimeout(onEnd,0); return; }
  const u=new SpeechSynthesisUtterance(text); const v=voices.find(v=>v.name===$('#voice').value); if(v) u.voice=v; u.rate=0.98; u.pitch=1.0;
  u.onboundary=e=>onBoundary&&onBoundary(e.charIndex); let ended=false; u.onend=()=>{ if(ended) return; ended=true; onEnd&&onEnd(); }; u.onerror=e=>{ if(ended) return; ended=true; if(e.error!=='canceled'&&e.error!=='interrupted'){ console.warn('tts error',e.error); onEnd&&onEnd(); } }; // cancel() never fires onEnd (scene change is guarded by sceneSerial); real failures (no voice, not-allowed…) count as 'said'
  window.__lastUtter=u; speechSynthesis.speak(u);
  setTimeout(()=>{ if(!ended&&!speechSynthesis.speaking&&!speechSynthesis.pending){ ended=true; onEnd&&onEnd(); } },1500); // no voice / TTS silently refused (headless, some Android): behave as if the line had been read
}

// ---------- Audio bed ----------
async function playBed(m){ stopBed(); if(!isCommons(m.ref)) return; const url=await commonsUrl(m.ref); bed=new Audio(url); bed.volume=0.18; bed.loop=true; bed.play().catch(()=>{}); }
function stopBed(){ if(bed){ bed.pause(); bed=null; } }

// ---------- Generated assets (SVG, inlined) ----------
const TOUR_DIR=TOUR_URL.replace(/[^/]*$/,'');
const genCache={};
const genUrl=ref=>/^(https?:)?\//.test(ref)?ref:TOUR_DIR+ref;
async function fetchGen(ref){ const url=genUrl(ref); if(genCache[url]!==undefined) return genCache[url];
  try{ const r=await fetch(url); if(!r.ok) throw new Error(r.status); const t=await r.text(); if(!/<svg[\s>]/i.test(t)) throw new Error('not svg'); genCache[url]=t; }catch(e){ console.warn('generated asset missing',url,e.message); genCache[url]=null; } return genCache[url]; }
function inlineSvg(txt, ref){
  const wrap=document.createElement('div'); wrap.className='genwrap'; wrap.innerHTML=txt; const svg=wrap.querySelector('svg'); if(!svg) return null;
  const base=genUrl(ref).replace(/[^/]*$/,'');
  svg.querySelectorAll('image').forEach(im=>['href','xlink:href'].forEach(a=>{ const v=im.getAttribute(a); if(v&&!/^(https?:|data:|blob:|\/)/.test(v)) im.setAttribute(a,base+v); }));
  if(!svg.getAttribute('viewBox')&&svg.getAttribute('width')) svg.setAttribute('viewBox',`0 0 ${parseFloat(svg.getAttribute('width'))} ${parseFloat(svg.getAttribute('height'))}`);
  svg.removeAttribute('width'); svg.removeAttribute('height'); svg.setAttribute('preserveAspectRatio','xMidYMid meet'); svg.classList.add('gen');
  $('#media').innerHTML=''; $('#media').appendChild(wrap); return svg;
}
const svgPoint=(svg,e)=>{ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
// scene-time media schedule: items {start, fn, onTick?}; fn switches #media when elapsed passes start
let sched=null, sceneSerial=0, genHooks={}, pickOption=null, gameApi=null;
function setSchedule(items){ sched={items:items.slice().sort((a,b)=>a.start-b.start), cur:-1, active:null}; schedTick(); }
function schedTick(){ if(!sched) return; let k=-1; sched.items.forEach((it,i)=>{ if(elapsed>=it.start) k=i; }); if(k!==sched.cur){ sched.cur=k; if(k>=0){ sched.active=sched.items[k]; sched.items[k].fn(); } } if(k>=0&&sched.items[k].onTick) sched.items[k].onTick(elapsed); }
function sceneCard(s, pendingIds){ $('#media').innerHTML=''; const ov=(s.overlays||[]).map(o=>`<div>${o.kind==='pin'?'📍 ':''}${o.text}</div>`).join('');
  card(`<h2>${s.title}</h2>${s.learning_goal?`<p><small>${s.learning_goal}</small></p>`:''}${ov?`<div style="margin-top:.6em;font-family:system-ui;font-size:.85em;color:#4a3d2f">${ov}</div>`:''}${pendingIds&&pendingIds.length?`<p><small>generated asset pending: ${pendingIds.join(', ')}</small></p>`:''}`); }
function mkGen(m, s, opts={}){ const it={start:m.start_s||0, m}; it.fn=async()=>{ const ser=sceneSerial; const txt=await fetchGen(m.ref); if(ser!==sceneSerial||sched.active!==it) return;
    if(!txt){ (opts.fail||(()=>sceneCard(s,[m.manifest_id])))(); return; } const svg=inlineSvg(txt,m.ref); if(!svg){ (opts.fail||(()=>sceneCard(s,[m.manifest_id])))(); return; } it.svg=svg; try{ opts.ok&&opts.ok(svg,it); }catch(e){ console.error(e); } }; return it; }
async function insetImage(m){ const im=document.createElement('img'); im.src=await commonsUrl(m.ref,800); im.alt=m.attribution||''; im.style.cssText='position:absolute;inset:auto;right:2vmin;bottom:2vmin;width:22%;height:auto;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.6)'; $('#media').appendChild(im); }

// G-01 route map: layers L0 base, L1..L9 legs (cumulative reveal across the media window), L10 enablers; .hit[data-leg] taps → option leg-1
function wireG01(svg,it,m,s){
  const legs=[]; for(let k=1;k<=9;k++){ const g=svg.querySelector('#L'+k); if(g) legs.push(g); }
  if(/full-loop/.test(m.ref)&&legs.length){ const a=m.start_s||0, b=(m.end_s!=null?m.end_s:s.duration_s), per=Math.max(0.5,(b-a)/legs.length);
    it.onTick=el=>{ const n=Math.min(legs.length, Math.floor((el-a)/per)+1); legs.forEach((g,i)=>g.style.display=i<n?'':'none'); }; it.onTick(elapsed); }
  svg.querySelectorAll('.hit[data-leg]').forEach(h=>{ h.style.cursor='pointer'; h.style.pointerEvents='stroke'; h.addEventListener('click',()=>{ const i=+h.dataset.leg-1; if(pickOption) pickOption(i); }); });
  genHooks.onPick=i=>{ const h=svg.querySelector(`.hit[data-leg="${i+1}"]`); if(h){ h.setAttribute('stroke','#b03a2e'); h.setAttribute('stroke-opacity','0.35'); } };
}
// G-02 then/now split: data-x0..y1 frame, #clip-now-rect + #seam translate; drag anywhere, ← → 2 %
function wireG02(svg){
  const x0=+svg.dataset.x0, x1=+svg.dataset.x1, rect=svg.querySelector('#clip-now-rect'), seamG=svg.querySelector('#seam'); if(!rect||!(x1>x0)) return;
  const rx=+rect.getAttribute('x')||0, rw=+rect.getAttribute('width')||0; const nowLeft = Math.abs(rx-x0)<1 && rw<(x1-x0)*0.99; // else "now" occupies seam..x1
  let seam=+(svg.dataset.seam||0.5); if(!(seam>=0&&seam<=1)) seam=0.5;
  const set=v=>{ seam=Math.max(0,Math.min(1,v)); const x=x0+seam*(x1-x0); if(nowLeft){ rect.setAttribute('x',x0); rect.setAttribute('width',x-x0); } else { rect.setAttribute('x',x); rect.setAttribute('width',x1-x); } if(seamG) seamG.setAttribute('transform',`translate(${x} 0)`); svg.dataset.seam=seam; };
  let down=false; svg.addEventListener('pointerdown',e=>{ down=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} set((svgPoint(svg,e).x-x0)/(x1-x0)); e.preventDefault(); });
  svg.addEventListener('pointermove',e=>{ if(down) set((svgPoint(svg,e).x-x0)/(x1-x0)); }); ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>down=false));
  svg.tabIndex=0; svg.setAttribute('aria-label','Then and now: drag the seam, or use the arrow keys'); svg.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){ set(seam-0.02); e.stopPropagation(); e.preventDefault(); } if(e.key==='ArrowRight'){ set(seam+0.02); e.stopPropagation(); e.preventDefault(); } });
  set(seam);
}
// G-04 timetable card: g.row[data-option] tap == option button; accent highlight on the picked row
function wireG04(svg){
  const rows=[...svg.querySelectorAll('g.row[data-option]')]; if(!rows.length) return;
  rows.forEach(r=>{ r.style.cursor='pointer'; r.setAttribute('tabindex','0'); r.setAttribute('role','button'); const go=()=>{ if(pickOption) pickOption(+r.dataset.option); }; r.addEventListener('click',go); r.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); go(); } }); });
  genHooks.onPick=i=>{ svg.querySelectorAll('.row-hl').forEach(x=>x.remove()); const r=rows.find(x=>+x.dataset.option===i); if(!r) return; const b=r.getBBox(); const hl=document.createElementNS('http://www.w3.org/2000/svg','rect'); hl.setAttribute('class','row-hl'); hl.setAttribute('x',b.x-6); hl.setAttribute('y',b.y-4); hl.setAttribute('width',b.width+12); hl.setAttribute('height',b.height+8); hl.setAttribute('rx',6); hl.setAttribute('fill','none'); hl.setAttribute('stroke','#b03a2e'); hl.setAttribute('stroke-width','5'); r.appendChild(hl); };
}
// G-07 carpet-bag game: drag .item into #bag-drop (or tap item, tap bag); correct → packed + counter; wrong → snap back + feedback; #close-btn → summary
function wireG07(svg,s){
  const it=s.interaction||{}; const items=[...svg.querySelectorAll('.item[data-option]')]; const drop=svg.querySelector('#bag-drop'), bag=svg.querySelector('#bag'), counter=svg.querySelector('#counter'), closeBtn=svg.querySelector('#close-btn'), packed=svg.querySelector('#packed')||bag, itemsG=svg.querySelector('#items')||svg;
  if(!items.length||!drop) return; const need=+((bag&&bag.dataset.need)||svg.dataset.need||6); let sel=null, locked=false;
  const body=svg.querySelector('#bag-body'); const bb=body?body.getBBox():drop.getBBox(); const tw=+svg.dataset.tileW||340, th=+svg.dataset.tileH||280, sc=0.5;
  const slots=[]; for(let r=0;r<2;r++) for(let c=0;c<3;c++) slots.push([bb.x+30+c*(tw*sc+30), bb.y+bb.height*0.22+r*(th*sc+20)]);
  const home=el=>el.setAttribute('transform','translate('+(el.dataset.home||'0 0')+')');
  const inBag=(x,y)=>{ const b=drop.getBBox(); return x>=b.x&&x<=b.x+b.width&&y>=b.y&&y<=b.y+b.height; };
  const count=()=>items.filter(i=>i.classList.contains('in')).length;
  const setIn=(i,on)=>{ const el=items.find(x=>+x.dataset.option===i); if(!el) return; if(on&&!el.classList.contains('in')){ el.classList.add('in'); el.classList.remove('sel','wrong'); packed.appendChild(el); const [sx,sy]=slots[Math.min(slots.length-1,[...packed.querySelectorAll('.item')].length-1)]; el.setAttribute('transform',`translate(${sx} ${sy}) scale(${sc})`); }
    else if(!on&&el.classList.contains('in')){ el.classList.remove('in'); itemsG.appendChild(el); home(el); } if(counter) counter.textContent=`${count()} of ${need}`; gameApi&&gameApi.setBtn&&gameApi.setBtn(i,on); if(sel===el) sel=null; };
  const snap=i=>{ const el=items.find(x=>+x.dataset.option===i); if(!el) return; el.classList.remove('sel'); el.classList.add('wrong'); home(el); setTimeout(()=>el.classList.remove('wrong'),1200); if(sel===el) sel=null; };
  const tryDrop=el=>{ const i=+el.dataset.option; bag&&bag.classList.remove('over'); if(el.dataset.correct==='true') setIn(i,true); else { snap(i); gameApi&&gameApi.feedback&&gameApi.feedback(i); } };
  const select=el=>{ items.forEach(x=>x.classList.remove('sel')); if(sel===el){ sel=null; return; } sel=el; el.classList.add('sel'); };
  items.forEach(el=>{ let start=null, moved=false, orig=null;
    el.addEventListener('pointerdown',e=>{ if(locked) return; e.preventDefault(); if(el.classList.contains('in')) return; start=svgPoint(svg,e); moved=false; orig=(el.dataset.home||'0 0').split(' ').map(Number); itemsG.appendChild(el); try{ el.setPointerCapture(e.pointerId);}catch(_){} el.classList.add('drag'); });
    el.addEventListener('pointermove',e=>{ if(!start) return; const p=svgPoint(svg,e); const dx=p.x-start.x, dy=p.y-start.y; if(Math.hypot(dx,dy)>8) moved=true; if(moved){ el.setAttribute('transform',`translate(${orig[0]+dx} ${orig[1]+dy})`); bag&&bag.classList.toggle('over',inBag(p.x,p.y)); } });
    const up=e=>{ if(!start) return; el.classList.remove('drag'); const p=svgPoint(svg,e); const wasMoved=moved; start=null; moved=false; if(wasMoved){ if(inBag(p.x,p.y)) tryDrop(el); else { home(el); bag&&bag.classList.remove('over'); } } else { select(el); } };
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',e=>{ if(start){ start=null; home(el); el.classList.remove('drag'); } });
    el.addEventListener('click',e=>{ if(locked) return; if(el.classList.contains('in')){ setIn(+el.dataset.option,false); } });

$('#btnCap').onclick=()=>{ captions=!captions; $('#btnCap').style.opacity=captions?1:.4; showScene(idx); };
$('#btnMute').onclick=()=>{ narrate=!narrate; $('#btnMute').textContent=narrate?'🔈':'🔇'; if(!narrate) speechSynthesis.cancel(); };
$('#btnList').onclick=()=>{ const n=prompt('Jump to scene number (1–'+scenes.length+'):\n'+scenes.map((s,i)=>`${i+1}. ${s.title}`).join('\n')); if(n) showScene(parseInt(n,10)-1); };
$('#testVoice').onclick=()=>{ localStorage.setItem('yy-voice',$('#voice').value); speak('It is Wednesday, the second of October, eighteen seventy-two. We have a train to catch.'); };
$('#voice').onchange=()=>localStorage.setItem('yy-voice',$('#voice').value);
$('#gkey').value=localStorage.getItem('yy-gkey')||''; $('#gkey').onchange=e=>localStorage.setItem('yy-gkey',e.target.value.trim());
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') showScene(idx-1); if(e.key===' '){ paused=!paused; e.preventDefault(); } });

(async()=>{
  try{ tour=await (await fetch(TOUR_URL)).json(); }catch(e){ $('#coverTitle').innerHTML='<h1>Yunyou</h1><p>Could not load '+TOUR_URL+'</p>'; return; }
  const ch=tour.chapters[0]; scenes=ch.scenes; $('#hTitle').textContent=tour.title;
  $('#coverTitle').innerHTML=`<p class="muted" style="letter-spacing:.2em;text-transform:uppercase">${tour.title}</p><h1>${ch.title}</h1><p>${ch.hook}</p><p class="muted">${scenes.length} scenes · about ${Math.round(scenes.reduce((a,s)=>a+s.duration_s,0)/60)} minutes · headphones recommended</p>`;
  $('#start').onclick=()=>{ localStorage.setItem('yy-voice',$('#voice').value); $('#cover').remove(); showScene(0); };
})();
</script>
</body>
</html>
